<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>COACH FLOORBALL - Professional System</title>
    <!-- Tailwind CSS CDN -->

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Space Grotesk"', 'sans-serif']
                    },
                    colors: {
                        brandDark: '#0F172A',
                        brandNavy: '#020617',
                        brandAccent: '#38BDF8'
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, select, textarea {
            user-select: text;
        }
        body {
            background-color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #334155;
            touch-action: manipulation;
        }
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (min-width: 640px) {
            #toast-container {
                left: auto;
                max-width: 380px;
            }
        }
        .toast {
            padding: 14px 20px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 20px 30px -5px rgba(15, 23, 42, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.875rem;
            font-weight: 700;
            border-left: 6px solid #1E3A8A;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast.success { border-left-color: #10B981; }
        .toast.error { border-left-color: #EF4444; }
        .toast.loading { border-left-color: #3B82F6; }
        
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #020617;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 99px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .glow-effect {
            box-shadow: 0 0 20px -5px rgba(59, 130, 246, 0.25);
        }
        aside {
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s ease;
        }

        /* PRINT OPTIMIZATION UNTUK PDF */
        @media print {
            aside, header, #toast-container, button, .no-print {
                display: none !important;
            }
            body, main, #main-container {
                background: white !important;
                color: black !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-700">

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- 1. LAYAR LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950">
        <div class="glass-card rounded-[32px] shadow-2xl p-6 sm:p-10 w-full max-w-md text-center border border-white/20 relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>

            <div class="w-20 h-20 bg-gradient-to-tr from-blue-700 via-indigo-600 to-cyan-400 text-white rounded-3xl flex items-center justify-center font-black text-3xl mx-auto mb-5 shadow-2xl shadow-blue-500/40 tracking-wider transform hover:rotate-6 transition-transform">

    <!-- 2. DASHBOARD UTAMA -->

        <!-- SIDEBAR -->
        <aside id="main-sidebar" class="w-full md:w-72 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-white flex flex-col justify-between shadow-2xl z-20 shrink-0 relative transition-all duration-300 border-r border-slate-800/80">
            <div>
                <!-- PERBAIKAN HEADER SIDEBAR MOBILE YANG RAPI DAN TIDAK BERTUMPUK -->
                <div class="p-4 border-b border-slate-800/80 flex items-center justify-between bg-slate-950 text-white">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-cyan-500 to-teal-400 text-white flex items-center justify-center font-black text-base shadow-lg shrink-0 font-display">

    <!-- MODAL FORM INPUT & EDIT DATA ATLET -->
    <div id="modal-atlet" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[32px] shadow-2xl border border-slate-100 w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">

                    <button type="button" onclick="closeModalAtlet()" class="px-6 py-3 rounded-2xl text-xs font-black text-slate-500 hover:bg-slate-100 transition-all">
                        Batal

                    <button type="submit" id="btn-submit-modal" class="px-6 py-3 rounded-2xl text-xs font-black bg-blue-900 hover:bg-blue-950 text-white transition-all shadow-lg shadow-blue-900/20">
                        Simpan Data Atlet
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGIKA APP JAVASCRIPT -->
    <script>
        const COACH_PASSWORD_DEFAULT = "midun15";

        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby3lbx4dHII9fEkcXGXURlSCHEfyeLS9Y7VM1WWnh919fjeG1xIWiShO0Ii7f2OOp6t/exec"; 

        async function syncDataToSpreadsheet() {
            const toast = showToast("Menyinkronkan data ke Google Spreadsheet...", "loading");
            
            const payload = {
                atlet: state.atlet,
                absensi: state.absensi,
                tesFisik: state.tesFisik,
                rpeLogs: state.rpeLogs
            };

            if (!GOOGLE_SHEET_WEB_APP_URL) {
                setTimeout(() => {
                    toast.remove();
                    showToast("Sinkronisasi Berhasil (Data Siap Diexport ke Spreadsheet)!", "success");
                    Swal.fire({
                        title: 'Info Integrasi Spreadsheet',
                        text: 'Untuk menghubungkan otomatis ke Google Sheets asli, pasang script Google Apps Script Web App dan masukkan URL-nya pada variabel GOOGLE_SHEET_WEB_APP_URL di kode.',
                        icon: 'info',
                        confirmButtonColor: '#1E3A8A',
                        customClass: { popup: 'rounded-3xl', confirmButton: 'rounded-2xl font-bold' }
                    });
                }, 1000);
                return;
            }

            try {
                const response = await fetch(GOOGLE_SHEET_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                toast.remove();
                showToast("Data berhasil disinkronkan ke Spreadsheet!", "success");
            } catch (err) {
                toast.remove();
                showToast("Gagal terhubung ke Google Spreadsheet.", "error");
            }
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function loadStorage(key, fallback) {
            try {
                const data = localStorage.getItem('cf_' + key);
                return data ? JSON.parse(data) : fallback;
            } catch(e) {
                return fallback;
            }
        }

        function saveStorage(key, value) {
            try {
                localStorage.setItem('cf_' + key, JSON.stringify(value));
            } catch (err) {
                showToast("Memori browser penuh! Hapus riwayat lama.", "error");
            }
        }

        const state = {
            loginRole: 'pelatih',
            currentRole: 'Pelatih',
            currentMenu: 'menu-1',
            sidebarCollapsed: false,
            activeAtlet: null,
            selectedProgramAtlet: null,
            selectedProgramWeek: 1,
            searchQueryAtlet: '',
            currentGpsLocation: null,
            absensiInputMode: 'single',
            periodisasiConfig: loadStorage('periodisasi', {
                startDate: new Date().toISOString().split('T')[0],
                totalWeeks: 12
            }),
            atlet: loadStorage('atlet', [
                { id: '1', nama: 'ARDEL', posisi: 'Goalkeeper', gender: 'Putra', usia: 22, tb: 175, bb: 68, pin: '1234', cedera: 'Pernah Ankle sprain kiri' },
                { id: '2', nama: 'Rian Ardianto', posisi: 'DL', gender: 'Putra', usia: 24, tb: 180, bb: 74, pin: '5678', cedera: 'Tidak ada' },
                { id: '3', nama: 'Siti Rahma', posisi: 'GK', gender: 'Putri', usia: 20, tb: 168, bb: 58, pin: '9012', cedera: 'Riwayat cedera lutut' },
                { id: '4', nama: 'Andi Pratama', posisi: 'DR', gender: 'Putra', usia: 21, tb: 172, bb: 65, pin: '1111', cedera: 'Tidak ada' },
                { id: '5', nama: 'Fajar Nugraha', posisi: 'FL', gender: 'Putra', usia: 23, tb: 178, bb: 70, pin: '2222', cedera: 'Tidak ada' },
                { id: '6', nama: 'Dimas Setiawan', posisi: 'C', gender: 'Putra', usia: 22, tb: 176, bb: 69, pin: '3333', cedera: 'Tidak ada' }
            ]),
            absensi: loadStorage('absensi', [
                { id: '101', atletId: '1', tanggal: '2026-07-28', jenis: 'Latihan Fisik', status: 'Hadir' },
                { id: '102', atletId: '2', tanggal: '2026-07-28', jenis: 'Latihan Fisik', status: 'Hadir' },
                { id: '103', atletId: '3', tanggal: '2026-07-28', jenis: 'Latihan Fisik', status: 'Izin' }
            ]),
            tesFisik: loadStorage('tesFisik', [
                { id: '201', atletId: '1', tanggal: '2026-07-30', keyTes: 'vsit', skor: '18' },
                { id: '202', atletId: '1', tanggal: '2026-07-30', keyTes: 'vjump', skor: '58' },
                { id: '203', atletId: '1', tanggal: '2026-07-30', keyTes: 'yoyo', skor: '48.5' },
                { id: '204', atletId: '2', tanggal: '2026-07-30', keyTes: 'yoyo', skor: '52.0' },
                { id: '205', atletId: '3', tanggal: '2026-07-30', keyTes: 'yoyo', skor: '40.0' }
            ]),
            tesTeknik: loadStorage('tesTeknik', []),

        function showToast(message, type = 'loading') {
            const container = document.getElementById('toast-container');
            if(!container) return null;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? 'fa-circle-check text-emerald-500' : (type === 'error' ? 'fa-circle-xmark text-rose-500' : 'fa-spinner fa-spin text-blue-800');
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
            container.appendChild(toast);

            if (type !== 'loading') {
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'all 0.35s ease';
                    setTimeout(() => toast.remove(), 350);
                }, 3000);
            }
            return toast;
        }

                let hadir = 0, telat = 0, sakit = 0, izin = 0, alpa = 0;
                records.forEach(r => {
                    if (r.status === 'Hadir') hadir++;
                    else if (r.status === 'Telat') telat++;
                    else if (r.status === 'Sakit') sakit++;
                    else if (r.status === 'Izin') izin++;

                const persentase = total > 0 ? Math.round(((hadir + telat) / total) * 100) : 0;
                return { ...a, total, hadir, telat, sakit, izin, alpa, persentase };
            });
        }

        function calculateAtletACWR(atletId) {
            const logs = state.rpeLogs.filter(r => r.atletId === atletId);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let acuteLoad = 0;   
            let chronicSum = 0;  

            logs.forEach(log => {
                if (!log.tanggal) return;
                const logDate = new Date(log.tanggal);
                logDate.setHours(0, 0, 0, 0);
                
                const diffDays = Math.floor((today - logDate) / (1000 * 60 * 60 * 24));

                if (diffDays >= 0 && diffDays < 7) {
                    acuteLoad += (log.sRPE || 0);
                }
                if (diffDays >= 0 && diffDays < 28) {
                    chronicSum += (log.sRPE || 0);
                }
            });

            const chronicLoad = Math.round(chronicSum / 4);
            let acwrRatio = chronicLoad > 0 ? parseFloat((acuteLoad / chronicLoad).toFixed(2)) : 0;

            let statusRisk = "Underloading";
            let badgeClass = "bg-slate-100 text-slate-700 border-slate-200";

            if (acwrRatio >= 0.8 && acwrRatio <= 1.3) {
                statusRisk = "Sweet Spot (Aman)";
                badgeClass = "bg-emerald-100 text-emerald-800 border-emerald-300";
            } else if (acwrRatio > 1.3 && acwrRatio <= 1.5) {
                statusRisk = "High Risk (Waspada)";
                badgeClass = "bg-amber-100 text-amber-800 border-amber-300";
            } else if (acwrRatio > 1.5) {
                statusRisk = "Danger Zone (Sangat Rawan)";
                badgeClass = "bg-rose-100 text-rose-800 border-rose-300";
            }

            return { acuteLoad, chronicLoad, acwrRatio, statusRisk, badgeClass, totalLogs: logs.length };
        }

        function autoFillJoggingVO2(atletId) {
            if(!atletId) return;
            const vo2Val = getAtletVO2Max(atletId);
            const displayVO2 = document.getElementById('jogging-vo2-display');
            const displayPace = document.getElementById('jogging-pace-display');
            const inputJarak = document.getElementById('jogging-jarak');
            const selectZona = document.getElementById('jogging-zona')?.value || '0.75';

            if (!vo2Val) {
                if (displayVO2) displayVO2.value = 'Belum Ada Data Tes Yo-Yo';
                if (displayPace) displayPace.value = '-';
                if (inputJarak) inputJarak.value = '';
                return;
            }

            if (displayVO2) displayVO2.value = `${vo2Val} ml/kg/m`;

            const masKmh = vo2Val / 3.5; 
            const zoneFactor = parseFloat(selectZona);
            const paceMinPerKm = 60 / (masKmh * zoneFactor); 
            
            const waktuMnt = parseFloat(document.getElementById('jogging-waktu')?.value || 30);
            if (inputJarak) {
                const autoDist = (waktuMnt / paceMinPerKm).toFixed(2);
                inputJarak.value = autoDist;
            }

            calculateRealtimePace();
        }

        function calculateRealtimePace() {
            const dist = parseFloat(document.getElementById('jogging-jarak')?.value || 3.93);
            const time = parseFloat(document.getElementById('jogging-waktu')?.value || 30);
            const displayPace = document.getElementById('jogging-pace-display');

            if (!displayPace) return;

            if (dist > 0 && time > 0) {
                const paceVal = time / dist;
                const mins = Math.floor(paceVal);
                const secs = Math.round((paceVal - mins) * 60).toString().padStart(2, '0');
                displayPace.value = `${mins}'${secs}" /km`;
            } else {
                displayPace.value = '-';
            }
        }

        function autoFillMASVO2(atletId) {
            if(!atletId) return;
            const vo2Val = getAtletVO2Max(atletId);
            const displayVO2 = document.getElementById('mas-vo2-display');
            
            if (!vo2Val) {
                if (displayVO2) displayVO2.value = 'Belum Ada Data Tes Yo-Yo';
                calculateMASDistances();
                return;
            }

            if (displayVO2) displayVO2.value = `${vo2Val} ml/kg/m`;
            calculateMASDistances();
        }

        function calculateMASDistances() {
            const atletId = document.getElementById('mas-atlet-id')?.value;
            const vo2Val = getAtletVO2Max(atletId);

            const walkSec = parseFloat(document.getElementById('mas-walk-sec')?.value || 0);
            const jogSec = parseFloat(document.getElementById('mas-jog-sec')?.value || 0);
            const sprintSec = parseFloat(document.getElementById('mas-sprint-sec')?.value || 0);

            const displayWalk = document.getElementById('mas-walk-dist-display');
            const displayJog = document.getElementById('mas-jog-dist-display');
            const displaySprint = document.getElementById('mas-sprint-dist-display');

            if (!vo2Val) {
                if (displayWalk) displayWalk.value = '-';
                if (displayJog) displayJog.value = '-';
                if (displaySprint) displaySprint.value = '-';
                return;
            }

            const masMPS = vo2Val / 12.6;

            const sprintDist = Math.round(sprintSec * (masMPS * 1.20));
            const jogDist = Math.round(jogSec * (masMPS * 0.70));
            const walkDist = Math.round(walkSec * (masMPS * 0.40));

            if (displaySprint) displaySprint.value = `${sprintDist} Meter`;
            if (displayJog) displayJog.value = `${jogDist} Meter`;
            if (displayWalk) displayWalk.value = `${walkDist} Meter`;
        }

            ];

            let currentWeek = 1;
            faseTemplates.forEach((tpl) => {
                let countWeeks = Math.round(totalWeeks * tpl.ratio);
                if (countWeeks < 1) countWeeks = 1;

                for (let i = 0; i < countWeeks; i++) {
                    if (currentWeek > totalWeeks) break;

            while (currentWeek <= totalWeeks) {
                const tpl = faseTemplates[faseTemplates.length - 1];

                currentWeek++;
            }

            return listMikro;
        }

        function hitungKategoriNorma(keyTes, valStr, gender, posisi) {
            const val = parseFloat(valStr);
            if (isNaN(val)) return '-';

            const isGK = (posisi === 'GK');
            const isPutra = (gender === 'Putra');

            if (keyTes === 'yoyo') {
                if (isPutra) {
                    if (val >= 52) return 'SB';
                    if (val >= 47) return 'B';
                    if (val >= 42) return 'S';
                    if (val >= 37) return 'K';
                    return 'SK';
                } else {
                    if (val >= 44) return 'SB';
                    if (val >= 39) return 'B';
                    if (val >= 34) return 'S';
                    if (val >= 29) return 'K';
                    return 'SK';
                }
            }

            if (keyTes === 'plank') {
                let pBase = isPutra ? 120 : 90;
                if (val >= pBase + 60) return 'SB';
                if (val >= pBase + 30) return 'B';
                if (val >= pBase) return 'S';
                if (val >= pBase - 30) return 'K';
                return 'SK';
            }

            if (keyTes === 'vsit') {
                let vBase = isPutra ? 15 : 18;
                if (val >= vBase + 8) return 'SB';
                if (val >= vBase + 3) return 'B';
                if (val >= vBase - 2) return 'S';
                if (val >= vBase - 6) return 'K';
                return 'SK';
            }

            if (['sprint20', 'ttest', 'rsa6x20', 'boxdrill', 'creade_rsa'].includes(keyTes)) {
                let baseThreshold = isPutra ? 11.5 : 13.0;
                if (keyTes === 'sprint20') baseThreshold = isPutra ? 3.2 : 3.6;
                if (keyTes === 'boxdrill') baseThreshold = isPutra ? 8.5 : 9.8;
                if (keyTes === 'creade_rsa') baseThreshold = isPutra ? 14.0 : 16.0;
                if (isGK) baseThreshold += 0.3;

                if (val <= baseThreshold - 0.4) return 'SB';
                if (val <= baseThreshold - 0.1) return 'B';
                if (val <= baseThreshold + 0.2) return 'S';
                if (val <= baseThreshold + 0.5) return 'K';
                return 'SK';
            }

            let repThreshold = isPutra ? 45 : 30;
            if (keyTes === 'vjump' || keyTes === 'kneeling') repThreshold = isPutra ? 50 : 40;
            if (isGK && ['plyo_push', 'push_up'].includes(keyTes)) repThreshold += 5;

            if (val >= repThreshold + 12) return 'SB';
            if (val >= repThreshold + 4) return 'B';
            if (val >= repThreshold - 4) return 'S';
            if (val >= repThreshold - 12) return 'K';
            return 'SK';
        }

        function handleCourtClick(e) {
            const court = e.currentTarget;
            const rect = court.getBoundingClientRect();
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const x = Math.round(((clientX - rect.left) / rect.width) * 100);
            const y = Math.round(((clientY - rect.top) / rect.height) * 100);

            const activePlayer = state.atlet.find(a => a.id === state.matchLive.activePlayerId);
            if (!activePlayer) return;

            const typeNames = { loss: 'Kehilangan Bola', intercept: 'Cut Bola', shoot_att: 'Percobaan Shoot' };
            
            state.matchLive.spatialEvents.unshift({
                id: Date.now().toString(), x, y, type: state.matchLive.activeSpatialEventType,
                playerId: activePlayer.id, timestamp: new Date().toLocaleTimeString()
            });

            state.matchLive.logs.unshift({
                id: Date.now().toString(), time: new Date().toLocaleTimeString(),
                playerId: activePlayer.id, type: 'spatial', desc: `[Spatial] ${escapeHTML(activePlayer.nama)} - ${typeNames[state.matchLive.activeSpatialEventType]} di (${x}%, ${y}%)`
            });

            saveStorage('matchLive', state.matchLive);
            renderMatchLiveUI();
            showToast(`Event dicatat untuk ${escapeHTML(activePlayer.nama)}!`, 'success');
        }

        function recordMatchStat(statType) {
            const playerId = state.matchLive.activePlayerId;
            const player = state.atlet.find(a => a.id === playerId);
            if (!player) return;

            const stats = state.matchLive.playerStats[playerId];
            let desc = '';
            if (statType === 'passAcc') { stats.passAcc++; desc = 'Passing Akurat'; }
            else if (statType === 'passFail') { stats.passFail++; desc = 'Passing Gagal'; }
            else if (statType === 'recAcc') { stats.recAcc++; desc = 'Receiving Berhasil'; }
            else if (statType === 'recFail') { stats.recFail++; desc = 'Receiving Gagal'; }
            else if (statType === 'shootAcc') { 
                stats.shootAcc++; 
                desc = 'Shoot Berhasil/Goal'; 
                state.matchLive.scoreTeam = (state.matchLive.scoreTeam || 0) + 1;
            }
            else if (statType === 'foul') {
                stats.foul = (stats.foul || 0) + 1;
                state.matchLive.foulTeam = (state.matchLive.foulTeam || 0) + 1;
                desc = 'Pelanggaran (Foul)';
            }

            state.matchLive.logs.unshift({
                id: Date.now().toString(), time: new Date().toLocaleTimeString(),
                playerId, type: 'action', desc: `${escapeHTML(player.nama)} - ${desc}`
            });

            saveStorage('matchLive', state.matchLive);
            renderMatchLiveUI();
            showToast(`Statistik ${desc} +1 (${escapeHTML(player.nama)})`, 'success');
        }

        function decrementMatchStat(e, statType) {
            if (e && e.stopPropagation) e.stopPropagation();
            const playerId = state.matchLive.activePlayerId;
            const player = state.atlet.find(a => a.id === playerId);
            if (!player) return;

            const stats = state.matchLive.playerStats[playerId];
            let desc = '';
            if (statType === 'passAcc' && stats.passAcc > 0) { stats.passAcc--; desc = 'Passing Akurat'; }
            else if (statType === 'passFail' && stats.passFail > 0) { stats.passFail--; desc = 'Passing Gagal'; }
            else if (statType === 'recAcc' && stats.recAcc > 0) { stats.recAcc--; desc = 'Receiving Berhasil'; }
            else if (statType === 'recFail' && stats.recFail > 0) { stats.recFail--; desc = 'Receiving Gagal'; }
            else if (statType === 'shootAcc' && stats.shootAcc > 0) { 
                stats.shootAcc--; 
                desc = 'Shoot Berhasil'; 
                state.matchLive.scoreTeam = Math.max(0, (state.matchLive.scoreTeam || 0) - 1);
            }
            else if (statType === 'foul' && stats.foul > 0) {
                stats.foul--;
                state.matchLive.foulTeam = Math.max(0, (state.matchLive.foulTeam || 0) - 1);
                desc = 'Pelanggaran (Foul)';
            }
            else return;

            state.matchLive.logs.unshift({
                id: Date.now().toString(), time: new Date().toLocaleTimeString(),
                playerId, type: 'action', desc: `[Koreksi -1] ${escapeHTML(player.nama)} - ${desc}`
            });

            saveStorage('matchLive', state.matchLive);
            renderMatchLiveUI();
            showToast(`Dikurangi -1 (${escapeHTML(player.nama)})`, 'error');
        }

            e.preventDefault();
            const atletIdElem = document.getElementById('multi-tes-atlet-id');
            const tanggalElem = document.getElementById('multi-tes-tanggal');
            const atletId = atletIdElem ? atletIdElem.value : '';
            const tanggal = tanggalElem ? tanggalElem.value : '';

            const atlet = state.atlet.find(a => a.id === atletId);
            if (!atlet) return;

            const newEntries = [];
            listFieldTes.forEach(f => {
                const elem = document.getElementById(`field-${f.key}`);
                if (elem && elem.value.trim() !== '') {
                    newEntries.push({ id: (Date.now() + Math.random()).toString(), atletId, tanggal, keyTes: f.key, skor: elem.value.trim() });
                }

        function getAtletGpsLocation() {
            if (navigator.geolocation) {
                showToast('Mengambil lokasi GPS...', 'loading');
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lng = position.coords.longitude.toFixed(4);
                        state.currentGpsLocation = `${lat}, ${lng}`;
                        const badge = document.getElementById('gps-status-badge');
                        if (badge) {
                            badge.className = 'px-4 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-black flex items-center gap-1.5';
                            badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> Lat: ${lat}, Lng: ${lng}`;
                        }
                        showToast('Titik GPS Berhasil Diambil!', 'success');
                    },
                    (error) => {
                        showToast('Gagal mengambil titik GPS. Pastikan Izin Akses Lokasi Aktif!', 'error');
                    }
                );
            } else {
                showToast('Browser Anda tidak mendukung Geolocation GPS.', 'error');
            }
        }

        function updateAtletJoggingCalculations() {
            const atlet = state.activeAtlet;
            if (!atlet) return;

            const historiList = (window.state && window.state.joggingLogs) || [];
            const matchLog = historiList.slice().reverse().find(item => 
                String(item.atletId) === String(atlet.id) || String(item.namaAtlet) === String(atlet.nama)
            );
            
            const waktuMnt = matchLog ? matchLog.waktu : 30;
            const zonaFactor = matchLog ? matchLog.zona : "0.75";
            const jarakKm = matchLog ? matchLog.jarak : 4.31;
            const paceFormatted = matchLog ? matchLog.pace : "6'58\"";
            const speedKmh = matchLog ? matchLog.speedKmh : 8.6;

            const durasiInput = document.getElementById('run-durasi');
            const zonaInput = document.getElementById('run-zona');
            if (durasiInput) durasiInput.value = waktuMnt;
            if (zonaInput) {
                const z = String(zonaFactor);
                if (z.includes('0.6')) zonaInput.value = 'Zone 1 (60% MAS)';
                else if (z.includes('0.8')) zonaInput.value = 'Zone 3 (80% MAS)';
                else if (z.includes('0.9')) zonaInput.value = 'Zone 4 (90% MAS)';
                else if (z.includes('1')) zonaInput.value = 'Zone 5 (100% MAS)';
                else zonaInput.value = 'Zone 2: Aerobic Base (75% MAS)';
            }

            if (document.getElementById('run-pace-display')) document.getElementById('run-pace-display').innerText = paceFormatted;
            if (document.getElementById('run-jarak-display')) document.getElementById('run-jarak-display').innerText = `${jarakKm} km`;
            if (document.getElementById('run-speed-display')) document.getElementById('run-speed-display').innerText = `${speedKmh} km/h`;
            if (document.getElementById('run-kalori-display')) document.getElementById('run-kalori-display').innerText = `${Math.round(jarakKm * 65 * 0.75)} kcal`;
        }

                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-5 mb-6">
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-black text-2xl shrink-0"><i class="fa-solid fa-shield-heart"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">Sweet Spot</p><h4 class="text-2xl font-black text-slate-800">${countSweet} Atlet</h4></div></div>
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center font-black text-2xl shrink-0"><i class="fa-solid fa-triangle-exclamation"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">High Risk</p><h4 class="text-2xl font-black text-slate-800">${countRisk} Atlet</h4></div></div>
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center font-black text-2xl shrink-0"><i class="fa-solid fa-biohazard"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">Danger Zone</p><h4 class="text-2xl font-black text-slate-800">${countDanger} Atlet</h4></div></div>
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-900 flex items-center justify-center font-black text-2xl shrink-0"><i class="fa-solid fa-bolt"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">Rerata Akut</p><h4 class="text-2xl font-black text-slate-800">${avgAcute} AU</h4></div></div>
                    </div>

                    <div class="bg-white rounded-[28px] border shadow-sm overflow-hidden">
                        <div class="p-5 border-b bg-slate-50/50"><h4 class="font-black text-slate-800 text-sm">Log Masuk Laporan RPE & Heart Rate Atlet</h4></div>
                        <div class="overflow-x-auto"><table class="w-full text-left border-collapse min-w-[700px]"><thead class="bg-slate-50 text-[10px] font-black text-slate-500 uppercase"><tr><th class="p-4">Tanggal</th><th class="p-4">Nama Atlet</th><th class="p-4 text-center">Skala RPE</th><th class="p-4 text-center">Durasi</th><th class="p-4 text-center">Max HR</th><th class="p-4 text-center">Session Load</th></tr></thead>
                        <tbody class="divide-y text-xs font-semibold">
                            ${state.rpeLogs.length > 0 ? state.rpeLogs.map(r => {
                                const pObj = state.atlet.find(a => a.id === r.atletId);
                                return `<tr><td class="p-4 font-mono">${r.tanggal}</td><td class="p-4 font-black">${pObj ? escapeHTML(pObj.nama) : 'Atlet'}</td><td class="p-4 text-center">RPE ${r.rpeVal}/10</td><td class="p-4 text-center font-mono">${r.durasi} mnt</td><td class="p-4 text-center font-mono text-rose-600">${r.hrMax || '-'} BPM</td><td class="p-4 text-center font-black text-blue-900">${r.sRPE} AU</td></tr>`;
                            }).join('') : `<tr><td colspan="6" class="p-6 text-center text-slate-400 italic">Belum ada laporan RPE.</td></tr>`}
                        </tbody></table></div>
                    </div>
                `;

            // ==================== B. MENU ATLET ====================
            } else if (state.currentMenu === 'menu-atlet-1') {
                pageTitle.innerText = "Dashboard Personal Atlet";
                const at = state.activeAtlet;
                if (!at) return;

                const myAbsensi = getAtletAbsensiSummary(at.id)[0] || { total: 0, hadir: 0, persentase: 0 };
                const myVo2Max = getAtletVO2Max(at.id) || 'Belum Ada';
                const myRpes = state.rpeLogs.filter(r => r.atletId === at.id);
                const lastRpe = myRpes.length > 0 ? myRpes[0] : null;

                container.innerHTML = `
                    <div class="bg-gradient-to-r from-slate-900 via-slate-950 to-blue-950 text-white p-6 sm:p-8 rounded-[32px] mb-6 shadow-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1.5"><span class="bg-emerald-500/20 text-emerald-300 text-[10px] font-extrabold px-3 py-1 rounded-full border border-emerald-500/30">SKUAD RESMI</span><span class="bg-white/10 text-slate-200 text-[10px] font-bold px-3 py-1 rounded-full">PIN: ${escapeHTML(at.pin)}</span></div>
                            <h4 class="text-2xl sm:text-3xl font-black font-display">${escapeHTML(at.nama)}</h4>
                            <p class="text-xs text-blue-200 mt-1 font-semibold">Posisi: <strong class="text-white">${escapeHTML(at.posisi)}</strong> | Gender: <strong class="text-white">${escapeHTML(at.gender)}</strong></p>
                        </div>
                        <div class="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center font-black text-3xl text-white font-display">${escapeHTML(at.nama.charAt(0))}</div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-900 flex items-center justify-center font-black text-xl shrink-0"><i class="fa-solid fa-clipboard-user"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">Kehadiran</p><h4 class="text-xl font-black text-slate-800">${myAbsensi.persentase}%</h4></div></div>
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-black text-xl shrink-0"><i class="fa-solid fa-heart-pulse"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">VO2Max</p><h4 class="text-xl font-black text-slate-800">${myVo2Max}</h4></div></div>
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center font-black text-xl shrink-0"><i class="fa-solid fa-bolt"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">sRPE Terakhir</p><h4 class="text-xl font-black text-slate-800">${lastRpe ? lastRpe.sRPE + ' AU' : '-'}</h4></div></div>
                        <div class="bg-white p-5 rounded-[28px] border shadow-sm flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center font-black text-xl shrink-0"><i class="fa-solid fa-notes-medical"></i></div><div><p class="text-[11px] font-extrabold text-slate-400 uppercase">Medis</p><h4 class="text-xs font-black text-slate-800 truncate max-w-[130px]">${escapeHTML(at.cedera)}</h4></div></div>
                    </div>
                `;
            } else if (state.currentMenu === 'menu-atlet-2') {
                pageTitle.innerText = "Laporan Hasil Tes Fisik Anda";
                const at = state.activeAtlet;
                if (!at) return;
                const records = state.tesFisik.filter(t => t.atletId === at.id);

                container.innerHTML = `
                    <div class="bg-white p-6 rounded-[28px] border shadow-sm mb-6">
                        <div class="flex justify-between items-center mb-4"><h3 class="text-base font-black text-slate-800 font-display">Evaluasi Fisik Personal & Norma</h3><span class="bg-blue-50 text-blue-900 px-3.5 py-1.5 rounded-xl text-xs font-black">${records.length} Teruji</span></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${listFieldTes.map(f => {
                                const tesItem = records.find(t => t.keyTes === f.key);
                                if (!tesItem) return '';
                                const kat = hitungKategoriNorma(f.key, tesItem.skor, at.gender, at.posisi);
                                return `<div class="border p-4 rounded-2xl bg-slate-50/50 flex justify-between items-center"><div><p class="text-[10px] font-black text-slate-400 uppercase">${escapeHTML(f.shortLabel)}</p><h5 class="text-xl font-black text-slate-800 font-display">${tesItem.skor} <span class="text-xs">${escapeHTML(f.satuan)}</span></h5></div><span class="px-3 py-1 rounded-xl text-xs font-black border bg-slate-100">${kat}</span></div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (state.currentMenu === 'menu-atlet-3') {
                pageTitle.innerText = "Riwayat Kehadiran Latihan";
                const at = state.activeAtlet;
                if (!at) return;
                const records = state.absensi.filter(a => a.atletId === at.id);
                const summary = getAtletAbsensiSummary(at.id)[0] || { total: 0, hadir: 0, persentase: 0 };

                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                        <div class="bg-white p-4.5 rounded-2xl border text-center"><span class="text-[10px] font-black text-slate-400 uppercase">Total</span><h4 class="text-2xl font-black">${summary.total}</h4></div>
                        <div class="bg-white p-4.5 rounded-2xl border text-center"><span class="text-[10px] font-black text-emerald-600 uppercase">Hadir</span><h4 class="text-2xl font-black text-emerald-700">${summary.hadir}</h4></div>
                        <div class="bg-white p-4.5 rounded-2xl border text-center"><span class="text-[10px] font-black text-amber-600 uppercase">Izin/Sakit</span><h4 class="text-2xl font-black text-amber-700">${summary.izin + summary.sakit}</h4></div>
                        <div class="bg-white p-4.5 rounded-2xl border text-center"><span class="text-[10px] font-black text-rose-500 uppercase">Alpa</span><h4 class="text-2xl font-black text-rose-600">${summary.alpa}</h4></div>
                    </div>
                    <div class="bg-white rounded-[28px] border overflow-hidden shadow-sm">
                        <div class="p-5 border-b bg-slate-50"><h4 class="font-black text-sm">Log Kehadiran Skuad</h4></div>
                        <table class="w-full text-left border-collapse"><thead class="bg-slate-50 text-[11px] font-black uppercase"><tr><th class="p-4">Tanggal</th><th class="p-4">Jenis Latihan</th><th class="p-4 text-center">Status</th></tr></thead>
                        <tbody class="divide-y text-xs font-semibold">
                            ${records.length > 0 ? records.map(r => `<tr><td class="p-4 font-mono">${r.tanggal}</td><td class="p-4">${escapeHTML(r.jenis)}</td><td class="p-4 text-center"><span class="border px-3 py-1 rounded-xl text-xs font-black">${escapeHTML(r.status)}</span></td></tr>`).join('') : `<tr><td colspan="3" class="p-6 text-center text-slate-400 italic">Belum ada catatan.</td></tr>`}
                        </tbody></table>
                    </div>
                `;
            } else if (state.currentMenu === 'menu-atlet-4') {
                pageTitle.innerText = "Laporan Sesi Jogging & Bukti GPS/PAP";
                const at = state.activeAtlet;
                if (!at) return;
                
                const myValidations = state.laporanValidasi.filter(l => l.atletId === at.id);
                const latestJog = state.joggingLogs.find(j => j.atletId === at.id);
                const defaultDurasi = latestJog ? latestJog.waktu : 30;
                const defaultZona = latestJog ? latestJog.zona : "0.75";

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 sm:p-8 rounded-[28px] border shadow-sm space-y-6">
                            <form onsubmit="submitAtletLaporanJogging(event)" class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div><label class="block text-[11px] font-black text-slate-500 uppercase mb-1.5">NAMA ATLET</label><select disabled class="w-full px-4 py-3 rounded-2xl border bg-slate-100 text-sm font-extrabold"><option>${escapeHTML(at.nama)}</option></select></div>
                                    <div><label class="block text-[11px] font-black text-slate-500 uppercase mb-1.5">DURASI (MENIT)</label><input type="text" id="run-durasi" readonly value="${defaultDurasi}" class="w-full px-4 py-3 rounded-2xl border bg-slate-100 text-sm font-extrabold"></div>
                                    <div><label class="block text-[11px] font-black text-slate-500 uppercase mb-1.5">INTENSITAS</label><input type="text" readonly value="${defaultZona === '0.60' ? 'Zone 1' : 'Zone 2: Aerobic Base'}" class="w-full px-4 py-3 rounded-2xl border bg-slate-100 text-sm font-extrabold"></div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="p-4 rounded-2xl bg-slate-50 border"><label class="block text-[11px] font-black text-slate-500 uppercase mb-2">1. GPS</label><button type="button" onclick="getAtletGpsLocation()" class="w-full px-4 py-3 rounded-2xl bg-blue-900 text-white font-extrabold text-xs shadow"><i class="fa-solid fa-crosshairs text-amber-400"></i> Ambil GPS</button><div id="gps-status-badge" class="w-full mt-2 px-3 py-2 bg-white text-slate-400 border rounded-xl text-xs font-bold text-center">Belum Diambil</div></div>
                                    <div class="p-4 rounded-2xl bg-emerald-50/60 border"><label class="block text-[11px] font-black text-emerald-800 uppercase mb-2">2. SELFIE WAJAH *</label><input type="file" id="run-file-selfie" accept="image/*" required class="w-full text-xs font-extrabold"></div>
                                    <div class="p-4 rounded-2xl bg-blue-50/60 border"><label class="block text-[11px] font-black text-blue-900 uppercase mb-2">3. BUKTI STRAVA *</label><input type="file" id="run-file-bukti" accept="image/*" required class="w-full text-xs font-extrabold"></div>
                                </div>
                                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div class="p-4 rounded-2xl bg-amber-50 border"><span class="block text-[10px] font-black text-amber-600 uppercase">PACE</span><h4 class="text-2xl font-black font-display" id="run-pace-display">-</h4></div>
                                    <div class="p-4 rounded-2xl bg-blue-50 border"><span class="block text-[10px] font-black text-blue-600 uppercase">JARAK</span><h4 class="text-2xl font-black font-display" id="run-jarak-display">-</h4></div>
                                    <div class="p-4 rounded-2xl bg-emerald-50 border"><span class="block text-[10px] font-black text-emerald-600 uppercase">KECEPATAN</span><h4 class="text-2xl font-black font-display" id="run-speed-display">-</h4></div>
                                    <div class="p-4 rounded-2xl bg-purple-50 border"><span class="block text-[10px] font-black text-purple-600 uppercase">KALORI</span><h4 class="text-2xl font-black font-display" id="run-kalori-display">-</h4></div>
                                </div>
                                <div class="flex justify-end"><button type="submit" class="bg-gradient-to-r from-orange-500 to-amber-600 text-white px-8 py-4 rounded-2xl font-black text-xs shadow-xl"><i class="fa-solid fa-plus"></i> Rekam & Verifikasi Laporan Lari</button></div>
                            </form>
                        </div>
                    </div>
                `;
                setTimeout(updateAtletJoggingCalculations, 50);

            } else if (state.currentMenu === 'menu-atlet-5') {
                pageTitle.innerText = "Input RPE & Heart Rate (Beban Latihan)";
                const at = state.activeAtlet;
                if (!at) return;
                const today = new Date().toISOString().split('T')[0];
                const myRpes = state.rpeLogs.filter(r => r.atletId === at.id);

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-[28px] border shadow-sm">
                            <h3 class="text-base font-black text-slate-800 mb-4 font-display">Input RPE</h3>
                            <form onsubmit="submitAtletRPE(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div><label class="block text-xs font-bold mb-1.5">Tanggal</label><input type="date" id="rpe-tanggal" required value="${today}" class="w-full px-4 py-3 rounded-2xl border text-sm"></div>
                                <div><label class="block text-xs font-bold mb-1.5">Skala RPE</label><select id="rpe-scale" onchange="updateRealtimeSRPE()" required class="w-full px-4 py-3 rounded-2xl border bg-white"><option value="5">5 - Berat</option><option value="7" selected>7 - Sangat Berat</option><option value="10">10 - Maksimal</option></select></div>
                                <div><label class="block text-xs font-bold mb-1.5">Durasi (Menit)</label><input type="number" id="rpe-durasi" oninput="updateRealtimeSRPE()" required value="90" class="w-full px-4 py-3 rounded-2xl border"></div>
                                <div><label class="block text-xs font-bold mb-1.5">Max HR (BPM)</label><input type="number" id="rpe-hrmax" placeholder="175" class="w-full px-4 py-3 rounded-2xl border"></div>
                                <div class="sm:col-span-2 lg:col-span-2 bg-blue-50/70 p-3.5 rounded-2xl border flex items-center justify-between"><span class="text-xs font-black text-blue-900 uppercase">Session Load</span><input type="text" id="rpe-srpe-display" readonly value="630 AU" class="w-28 text-right font-mono font-black text-base text-blue-900 bg-transparent"></div>
                                <div class="sm:col-span-2 lg:col-span-2 flex items-end justify-end"><button type="submit" class="w-full bg-blue-900 text-white py-3 px-8 rounded-2xl font-black text-xs shadow-lg">Simpan RPE</button></div>
                            </form>
                        </div>
                    </div>
                `;
            } else {
                if(pageTitle) pageTitle.innerText = "Modul";
                if(container) container.innerHTML = `<div class="bg-white p-12 rounded-[28px] border text-center"><h3 class="text-base font-black text-slate-800">Modul Siap Digunakan</h3></div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            selectLoginRole('pelatih');
        });
    </script>
</body>
</html>
