    <script>
      // Auto Sync di Background
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8yriN-6Hd8qHuHOHGwbSUExTZZsH_D1tgiTCBlwJSQ2r5_T3i7A2XGk5Dnb3vREKU/exec";

      async function autoFetchFromSpreadsheet() {
      try {
        const res = await fetch(`${GOOGLE_SHEET_WEB_APP_URL || SCRIPT_URL}?_t=${new Date().getTime()}`);
        const data = await res.json();
        
        if (data && data.status === "success") {
          // 1. Update Data Atlet
          if (data.atlet && Array.isArray(data.atlet) && data.atlet.length > 0) {
            state.atlet = data.atlet;
            saveStorage("atlet", data.atlet);
          }

          // 2. Sinkronisasi Log Jogging
          const localJogging = loadStorage("joggingLogs") || state.joggingLogs || [];
          const serverJogging = data.joggingLogs || data.programLatihan || [];
          const dailyMap = new Map();

          [...localJogging, ...serverJogging].forEach(item => {
            if (item && item.atletId) {
              dailyMap.set(String(item.atletId), item);
            }
          });

          state.joggingLogs = Array.from(dailyMap.values()).slice(0, 41);
          saveStorage("joggingLogs", state.joggingLogs);

          // 3. Update Laporan Validasi
          if (data.laporanValidasi && Array.isArray(data.laporanValidasi) && data.laporanValidasi.length > 0) {
            const localVal = loadStorage("laporanValidasi") || state.laporanValidasi || [];
            const mergedVal = new Map();

            localVal.forEach(item => { 
              if (item && item.id) mergedVal.set(String(item.id), item); 
            });
            
            data.laporanValidasi.forEach(serverItem => {
              if (serverItem && serverItem.id) {
                const localItem = mergedVal.get(String(serverItem.id));
                if (!localItem || localItem.status === 'Menunggu') {
                  mergedVal.set(String(serverItem.id), serverItem);
                }
              }
            });

            state.laporanValidasi = Array.from(mergedVal.values());
            saveStorage("laporanValidasi", state.laporanValidasi);
          }

          // 4. Render Ulang Tampilan Otomatis
          if (typeof renderContent === 'function') {
            renderContent();
          }
        }
      } catch (e) {
        console.log("Sync otomatis pending connection...");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      autoFetchFromSpreadsheet(); // Jalankan sekali saat pertama dimuat
      setInterval(autoFetchFromSpreadsheet, 30000); // Polling setiap 30 detik
    });
		
    </script>

        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.crossOrigin = "Anonymous"; // Mencegah error Tainted Canvas
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width = Math.round((width * maxHeight) / height);
                        height = maxHeight;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
    });
}

            for (const item of pendingQueue) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    await fetch(GOOGLE_SHEET_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(item.payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                } catch (err) {
                    remainingQueue.push(item);
                }
            }

            saveStorage('pendingSyncQueue', remainingQueue);
            if (remainingQueue.length === 0) {
                showToast("Data offline berhasil terintegrasi!", "success");
            }
        }

        window.addEventListener('online', () => {
            showToast("Koneksi terhubung kembali. Memproses data...", "loading");
            processPendingSyncQueue();
        });

  // Variable Global untuk Tracking GPS & Aktivitas
let gpsWatchId = null;
let lastValidCoord = null;
let totalDistanceKm = 0;

function handleGpsUpdate(position) {
    const { latitude, longitude, accuracy } = position.coords;
    const timestamp = position.timestamp || Date.now();

    // 1. Buang sinyal dengan akurasi buruk
    if (accuracy > 15) return;

    if (lastValidCoord) {
        const timeDiffSec = (timestamp - lastValidCoord.timestamp) / 1000;
        if (timeDiffSec < 1) return; // Debounce update yang terlalu rapat

        const distKm = calculateHaversineDistance(
            lastValidCoord.lat, lastValidCoord.lng, latitude, longitude
        );
        const distMeters = distKm * 1000;
        const currentSpeedKmh = (distKm / (timeDiffSec / 3600));

        // 2. Filter Drift: abaikan gerakan mikro < 4 meter
        if (distMeters < 4) return;

        // 3. Filter Teleportasi / Speed Anomali (> 30 km/jam untuk atlet lari)
        if (currentSpeedKmh > 30) {
            console.warn("Anomali kecepatan terdeteksi:", currentSpeedKmh);
            return;
        }

        totalDistanceKm += distKm;
    }

    lastValidCoord = { lat: latitude, lng: longitude, timestamp };
}

// Fungsi Mulai Tracking Live dengan Deteksi Aktivitas
function startLiveGpsTracking() {
    const badge = document.getElementById('gps-status-badge');
    if (!navigator.geolocation) {
        showToast("GPS tidak didukung browser HP ini!", "error");
        return;
    }
    
    totalDistanceKm = 0;
    lastCoord = null;

    if (badge) {
        badge.className = 'w-full mt-2.5 px-3.5 py-2.5 bg-blue-50 text-blue-900 border border-blue-200 rounded-2xl';
        badge.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-blue-600 mr-1"></i> Tracking GPS Aktif... Melacak Aktivitas`;
    }

    gpsWatchId = navigator.geolocation.watchPosition(
        (position) => {
            const { latitude, longitude, accuracy, speed } = position.coords;
            
            // Filter akurasi rendah (> 15 meter) agar data tidak meloncat
            if (accuracy > 15) return;

            const currentTime = Date.now();

            if (lastCoord) {
                const timeDiffHours = (currentTime - lastCoord.timestamp) / (1000 * 3600); // Waktu dalam jam
                const dist = calculateHaversineDistance(lastCoord.lat, lastCoord.lng, latitude, longitude); // Jarak dalam KM
                
                // Hitung kecepatan real-time (km/jam)
                let currentSpeedKmh = speed ? (speed * 3.6) : (timeDiffHours > 0 ? (dist / timeDiffHours) : 0);

                // Filter gerakan halus saat diam (hanya hitung jika berpindah > 3 meter)
                if (dist > 0.003) { 
                    totalDistanceKm += dist;
                    lastCoord = { lat: latitude, lng: longitude, timestamp: currentTime };
                }

                // --- DETEKSI AUTOMATIS JENIS AKTIVITAS ---
                let jenisAktivitas = "Diam / Istirahat";
                let badgeStyle = "bg-emerald-50 text-emerald-900 border-emerald-200";
                let iconAktivitas = "fa-person-walking";

                if (currentSpeedKmh > 25) {
                    jenisAktivitas = "TERDETEKSI NAIK MOTOR / KENDARAAN!";
                    badgeStyle = "bg-rose-100 text-rose-900 border-rose-300 animate-bounce";
                    iconAktivitas = "fa-motorcycle text-rose-600";
                    showToast("Peringatan: Kecepatan terlalu tinggi (Terdeteksi naik kendaraan)!", "error");
                } else if (currentSpeedKmh >= 12) {
                    jenisAktivitas = "Berlari Cepat (Sprint)";
                    badgeStyle = "bg-blue-50 text-blue-900 border-blue-200";
                    iconAktivitas = "fa-person-running text-blue-600";
                } else if (currentSpeedKmh >= 6) {
                    jenisAktivitas = "Jogging (Aerobic)";
                    badgeStyle = "bg-emerald-50 text-emerald-900 border-emerald-200";
                    iconAktivitas = "fa-person-running text-emerald-600";
                } else if (currentSpeedKmh > 1.5) {
                    jenisAktivitas = "Berjalan";
                    badgeStyle = "bg-amber-50 text-amber-900 border-amber-200";
                    iconAktivitas = "fa-person-walking text-amber-600";
                }

                // Update Simpan Lokasi & Status ke State Aplikasi
                state.currentGpsLocation = `${latitude.toFixed(5)}, ${longitude.toFixed(5)} (${jenisAktivitas})`;
                
                const distDisplay = document.getElementById('run-jarak-display');
                if (distDisplay) distDisplay.innerText = `${totalDistanceKm.toFixed(2)} km`;

                if (badge) {
                    badge.className = `w-full mt-2.5 px-3.5 py-2.5 rounded-2xl border ${badgeStyle}`;
                    badge.innerHTML = `
                        <div class="flex items-center justify-between font-bold text-xs">
                            <span><i class="fa-solid ${iconAktivitas} mr-1"></i> ${jenisAktivitas}</span>
                            <span class="font-mono">${totalDistanceKm.toFixed(2)} KM (${currentSpeedKmh.toFixed(1)} km/h)</span>
                        </div>
                    `;
                }

            } else {
                lastCoord = { lat: latitude, lng: longitude, timestamp: currentTime };
            }
        },
        (error) => {
            console.warn("GPS Tracking Error:", error);
            showToast("Gagal mengambil sinyal GPS Live!", "error");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
}

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getNormaSlalom(waktuStr, jarak, gender) {
            const val = parseFloat(waktuStr);
            if (!val || isNaN(val) || val <= 0) return { skor: '-', kat: '-', color: 'bg-slate-100 text-slate-300 border-slate-200' };

            let sb = 24.0, b = 28.0, s = 32.0, k = 36.0;
            if (jarak === 7) { sb = 28.0; b = 32.0; s = 36.0; k = 40.0; }
            else if (jarak === 9) { sb = 32.0; b = 36.0; s = 40.0; k = 44.0; }

            if (gender === 'Putri') { sb += 3.0; b += 3.0; s += 3.0; k += 3.0; }

            let kat = 'SK', color = 'bg-rose-500 text-white border-rose-600';
            if (val <= sb) { kat = 'SB'; color = 'bg-emerald-500 text-white border-emerald-600'; }
            else if (val <= b) { kat = 'B'; color = 'bg-blue-500 text-white border-blue-600'; }
            else if (val <= s) { kat = 'S'; color = 'bg-amber-400 text-amber-950 border-amber-500'; }
            else if (val <= k) { kat = 'K'; color = 'bg-orange-500 text-white border-orange-600'; }

            return { skor: val.toFixed(2) + 's', kat, color };
        }

// FITUR RESTORE DATA DARI FILE JSON
function restoreDataJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            
            if (data.atlet) { state.atlet = data.atlet; saveStorage('atlet', state.atlet); }
            if (data.absensi) { state.absensi = data.absensi; saveStorage('absensi', state.absensi); }
            if (data.tesFisik) { state.tesFisik = data.tesFisik; saveStorage('tesFisik', state.tesFisik); }
            if (data.tesTeknik) { state.tesTeknik = data.tesTeknik; saveStorage('tesTeknik', state.tesTeknik); }
            if (data.rpeLogs) { state.rpeLogs = data.rpeLogs; saveStorage('rpeLogs', state.rpeLogs); }
            if (data.joggingLogs) { state.joggingLogs = data.joggingLogs; saveStorage('joggingLogs', state.joggingLogs); }
            if (data.masLogs) { state.masLogs = data.masLogs; saveStorage('masLogs', state.masLogs); }
            if (data.laporanValidasi) { state.laporanValidasi = data.laporanValidasi; saveStorage('laporanValidasi', state.laporanValidasi); }

            renderSidebar();
            renderContent();
            showToast("Database berhasil dipulihkan dari file JSON!", "success");
        } catch (err) {
            showToast("Gagal memulihkan: Format file JSON tidak valid!", "error");
        }
    };
    reader.readAsText(file);
}

        function getAtletVO2Max(atletId) {
            const records = state.tesFisik.filter(t => String(t.atletId) === String(atletId) && t.keyTes === 'yoyo');

        function calculateAtletACWR(atletId) {
            const logs = state.rpeLogs.filter(r => String(r.atletId) === String(atletId));
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let acuteLoad = 0;   
            let chronicSum = 0;  

            logs.forEach(log => {
                if (!log.tanggal) return;
                const logDate = new Date(log.tanggal);
                logDate.setHours(0, 0, 0, 0);
                
                const diffDays = Math.floor((today - logDate) / (1000 * 60 * 60 * 24));

                if (diffDays >= 0 && diffDays < 7) {
                    acuteLoad += (log.sRPE || 0);
                }
                if (diffDays >= 0 && diffDays < 28) {
                    chronicSum += (log.sRPE || 0);
                }
            });

            const chronicLoad = Math.round(chronicSum / 4);
            let acwrRatio = chronicLoad > 0 ? parseFloat((acuteLoad / chronicLoad).toFixed(2)) : 0;

            let statusRisk = "Underloading";
            let badgeClass = "bg-slate-100 text-slate-700 border-slate-200";

            if (acwrRatio >= 0.8 && acwrRatio <= 1.3) {
                statusRisk = "Sweet Spot (Aman)";
                badgeClass = "bg-emerald-100 text-emerald-800 border-emerald-300";
            } else if (acwrRatio > 1.3 && acwrRatio <= 1.5) {
                statusRisk = "High Risk (Waspada)";
                badgeClass = "bg-amber-100 text-amber-800 border-amber-300";
            } else if (acwrRatio > 1.5) {
                statusRisk = "Danger Zone (Sangat Rawan)";
                badgeClass = "bg-rose-100 text-rose-800 border-rose-300";
            }

            return { acuteLoad, chronicLoad, acwrRatio, statusRisk, badgeClass, totalLogs: logs.length };
        }

function getACWRStatus(atlet) {
    const ac = calculateAtletACWR(atlet.id);
    if (ac.totalLogs === 0) {
        return { ratio: '0.00', label: 'No Data', color: 'bg-slate-100 text-slate-600 border-slate-300' };
    }
    if (ac.acwrRatio < 0.8) return { ratio: ac.acwrRatio, label: 'Under', color: 'bg-blue-50 text-blue-700 border-blue-200' };
    if (ac.acwrRatio <= 1.3) return { ratio: ac.acwrRatio, label: 'Optimal', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
    if (ac.acwrRatio <= 1.5) return { ratio: ac.acwrRatio, label: 'Caution', color: 'bg-amber-50 text-amber-700 border-amber-200' };
    return { ratio: ac.acwrRatio, label: 'High Risk', color: 'bg-rose-50 text-rose-700 border-rose-200' };
}

            const sprintDist = Math.round(sprintSec * (masMPS * 1.20));

            if (displaySprint) displaySprint.value = `${sprintDist} Meter`;

// LOGIKA PEMBARUAN METRIK KIPER (GK ANALYTICS) & LINE RATING

function recordGKStat(gkId, statType, delta = 1) {
    if (!gkId) {
        showToast("Pilih Kiper aktif terlebih dahulu!", "error");
        return;
    }
    
    if (!state.matchLive.gkStats) state.matchLive.gkStats = {};
    if (!state.matchLive.gkStats[gkId]) {
        state.matchLive.gkStats[gkId] = { saves: 0, goalsConceded: 0, outletAcc: 0, outletFail: 0 };
    }

    const gk = state.matchLive.gkStats[gkId];
    const gkObj = state.atlet.find(a => String(a.id) === String(gkId));
    const gkNama = gkObj ? gkObj.nama.split(' ')[0] : 'GK';

    if (statType === 'saves') {
        gk.saves = Math.max(0, gk.saves + delta);
    } else if (statType === 'goalsConceded') {
        gk.goalsConceded = Math.max(0, gk.goalsConceded + delta);
        if (delta > 0) {
            updateMatchScore('opponent', 1, false);
        }
    } else if (statType === 'outletAcc') {
        gk.outletAcc = Math.max(0, gk.outletAcc + delta);
    } else if (statType === 'outletFail') {
        gk.outletFail = Math.max(0, gk.outletFail + delta);
    }

    if (delta > 0) {
        const descMap = {
            saves: `Saves Gemilang!`,
            goalsConceded: `Kemasukan Gol`,
            outletAcc: `Lemparan Outlet Akurat`,
            outletFail: `Lemparan Outlet Gagal`
        };
        state.matchLive.logs.unshift({
            id: 'gk_' + Date.now(),
            time: new Date().toLocaleTimeString(),
            playerId: gkId,
            type: 'gk_action',
            desc: `[GK ${gkNama}] - ${descMap[statType]}`
        });
    }

    saveStorage('matchLive', state.matchLive);
    renderMatchLiveUI();
    showToast(`GK ${gkNama}: ${statType} diperbarui`, 'success');
}

function calculateGKSavePercentage(gkId) {
    const gk = state.matchLive.gkStats?.[gkId];
    if (!gk) return 0;
    const totalShotsOnTarget = gk.saves + gk.goalsConceded;
    if (totalShotsOnTarget === 0) return 0;
    return Math.round((gk.saves / totalShotsOnTarget) * 100);
}

function calculateGKOutletAccuracy(gkId) {
    const gk = state.matchLive.gkStats?.[gkId];
    if (!gk) return 0;
    const totalOutlets = gk.outletAcc + gk.outletFail;
    if (totalOutlets === 0) return 0;
    return Math.round((gk.outletAcc / totalOutlets) * 100);
}

function updateLineStats(isGoalFor) {
    const activeLine = state.matchLive.activeLine || 'Line 1';
    if (!state.matchLive.lineStats) state.matchLive.lineStats = {};
    if (!state.matchLive.lineStats[activeLine]) {
        state.matchLive.lineStats[activeLine] = { goalsFor: 0, goalsAgainst: 0, plusMinus: 0, shiftsCount: 0 };
    }

    const line = state.matchLive.lineStats[activeLine];
    if (isGoalFor) {
        line.goalsFor += 1;
    } else {
        line.goalsAgainst += 1;
    }
    line.plusMinus = line.goalsFor - line.goalsAgainst;
    saveStorage('matchLive', state.matchLive);
}

// FUNGSI SKOR BARU (MENIMPA BARIS 2374 LAMA)
function updateMatchScore(team, delta, triggerGKConceded = true) {
    if (team === 'team') {
        state.matchLive.scoreTeam = Math.max(0, (state.matchLive.scoreTeam || 0) + delta);
        if (delta > 0) updateLineStats(true);
    } else {
        state.matchLive.scoreOpponent = Math.max(0, (state.matchLive.scoreOpponent || 0) + delta);
        if (delta > 0) {
            updateLineStats(false);
            if (triggerGKConceded && state.matchLive.activeGKId) {
                if (!state.matchLive.gkStats) state.matchLive.gkStats = {};
                if (!state.matchLive.gkStats[state.matchLive.activeGKId]) {
                    state.matchLive.gkStats[state.matchLive.activeGKId] = { saves: 0, goalsConceded: 0, outletAcc: 0, outletFail: 0 };
                }
                state.matchLive.gkStats[state.matchLive.activeGKId].goalsConceded += 1;
            }
        }
    }
    saveStorage('matchLive', state.matchLive);
    renderMatchLiveUI();
}

        function updateMatchFoul(team, delta) {
            if (team === 'team') {
                state.matchLive.foulTeam = Math.max(0, (state.matchLive.foulTeam || 0) + delta);
            } else {
                state.matchLive.foulOpponent = Math.max(0, (state.matchLive.foulOpponent || 0) + delta);

            if (!state.matchLive.matchTimer) {
                state.matchLive.matchTimer = { isRunning: false, startTime: null, intervalId: null, elapsedSec: 0 };

            const timer = state.matchLive.matchTimer;

            if (!timer.isRunning) {
                timer.isRunning = true;
                timer.startTime = Date.now() - (timer.elapsedSec * 1000);
                timer.intervalId = setInterval(() => {
                    timer.elapsedSec = Math.floor((Date.now() - timer.startTime) / 1000);
                    const timerElem = document.getElementById('match-timer-display');
                    if (timerElem) {
                        const m = Math.floor(timer.elapsedSec / 60).toString().padStart(2, '0');
                        const s = (timer.elapsedSec % 60).toString().padStart(2, '0');
                        timerElem.innerText = `${m}:${s}`;
                    }
                }, 200);
                showToast(`Waktu Pertandingan Dimulai...`, 'loading');
            } else {
                clearInterval(timer.intervalId);
                timer.isRunning = false;
                saveStorage('matchLive', state.matchLive);
                renderMatchLiveUI();
                showToast(`Waktu Pertandingan Dihentikan`, 'success');
            }
            renderMatchLiveUI();

        function handleCourtClick(e) {
            const court = e.currentTarget;
            const rect = court.getBoundingClientRect();
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;

        function recordMatchStat(statType) {
            const playerId = state.matchLive.activePlayerId;
            const player = state.atlet.find(a => a.id === playerId);
            if (!player) return;

            const stats = state.matchLive.playerStats[playerId];
            let desc = '';
            if (statType === 'passAcc') { stats.passAcc++; desc = 'Passing Akurat'; }
            else if (statType === 'passFail') { stats.passFail++; desc = 'Passing Gagal'; }
            else if (statType === 'recAcc') { stats.recAcc++; desc = 'Receiving Berhasil'; }
            else if (statType === 'recFail') { stats.recFail++; desc = 'Receiving Gagal'; }
            else if (statType === 'shootAcc') { 
                stats.shootAcc++; 
                desc = 'Shoot Berhasil/Goal'; 
                state.matchLive.scoreTeam = (state.matchLive.scoreTeam || 0) + 1;
            }
            else if (statType === 'foul') {
                stats.foul = (stats.foul || 0) + 1;
                state.matchLive.foulTeam = (state.matchLive.foulTeam || 0) + 1;
                desc = 'Pelanggaran (Foul)';
            }

            state.matchLive.logs.unshift({
                id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4), time: new Date().toLocaleTimeString(),
                playerId, type: 'action', desc: `${escapeHTML(player.nama)} - ${desc}`
            });

            saveStorage('matchLive', state.matchLive);
            renderMatchLiveUI();
            showToast(`Statistik ${desc} +1 (${escapeHTML(player.nama)})`, 'success');
        }

        function decrementMatchStat(e, statType) {
            if (e && e.stopPropagation) e.stopPropagation();
            const playerId = state.matchLive.activePlayerId;
            const player = state.atlet.find(a => a.id === playerId);
            if (!player) return;

            const stats = state.matchLive.playerStats[playerId];
            let desc = '';
            if (statType === 'passAcc' && stats.passAcc > 0) { stats.passAcc--; desc = 'Passing Akurat'; }
            else if (statType === 'passFail' && stats.passFail > 0) { stats.passFail--; desc = 'Passing Gagal'; }
            else if (statType === 'recAcc' && stats.recAcc > 0) { stats.recAcc--; desc = 'Receiving Berhasil'; }
            else if (statType === 'recFail' && stats.recFail > 0) { stats.recFail--; desc = 'Receiving Gagal'; }
            else if (statType === 'shootAcc' && stats.shootAcc > 0) { 
                stats.shootAcc--; 
                desc = 'Shoot Berhasil'; 
                state.matchLive.scoreTeam = Math.max(0, (state.matchLive.scoreTeam || 0) - 1);
            }
            else if (statType === 'foul' && stats.foul > 0) {
                stats.foul--;
                state.matchLive.foulTeam = Math.max(0, (state.matchLive.foulTeam || 0) - 1);
                desc = 'Pelanggaran (Foul)';
            }
            else return;

            state.matchLive.logs.unshift({
                id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4), time: new Date().toLocaleTimeString(),
                playerId, type: 'action', desc: `[Koreksi -1] ${escapeHTML(player.nama)} - ${desc}`
            });

            saveStorage('matchLive', state.matchLive);
            renderMatchLiveUI();
            showToast(`Dikurangi -1 (${escapeHTML(player.nama)})`, 'error');
        }

        function toggleDribbleTimer() {
            const timer = state.matchLive.dribbleTimer;
            const playerId = state.matchLive.activePlayerId;
            const player = state.atlet.find(a => a.id === playerId);

            if (!timer.isRunning) {
                timer.isRunning = true;
                timer.startTime = Date.now();
                timer.intervalId = setInterval(() => {
                    timer.elapsedSec = Math.floor((Date.now() - timer.startTime) / 1000);
                    const timerElem = document.getElementById('dribble-display-seconds');
                    if (timerElem) timerElem.innerText = `${timer.elapsedSec}s`;
                }, 200);
                showToast(`Timer Dribble dimulai...`, 'loading');
            } else {
                clearInterval(timer.intervalId);
                timer.isRunning = false;
                state.matchLive.playerStats[playerId].dribbleTime += timer.elapsedSec;
                state.matchLive.logs.unshift({
                    id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4), time: new Date().toLocaleTimeString(),
                    playerId, type: 'dribble', desc: `${escapeHTML(player.nama)} - Dribble bola selama ${timer.elapsedSec} detik`
                });
                timer.elapsedSec = 0;
                saveStorage('matchLive', state.matchLive);
                renderMatchLiveUI();
                showToast(`Dribble dicatat!`, 'success');
            }
            renderMatchLiveUI();
        }

        function updateProgramLatihanUI() {
    const area = document.getElementById('program-result-area');
    if (!area) return;

    let atlet = state.atlet.find(a => String(a.id) === String(state.selectedProgramAtlet));
    
    if (!atlet && state.selectedProgramAtlet) {
        const selectElem = document.getElementById('prog-atlet');
        if (selectElem && selectElem.selectedIndex !== -1) {
            const selectedText = selectElem.options[selectElem.selectedIndex].text;
            const namaOnly = selectedText.split(' (')[0].trim();
            atlet = state.atlet.find(a => a.nama === namaOnly);
        }
    }

    if (!atlet) {
        atlet = state.atlet[0] || { id: '1', nama: 'Atlet', posisi: '-' };
    }

    const listMikro = generateDynamicPeriodisasi(state.periodisasiConfig.startDate, state.periodisasiConfig.totalWeeks);
    const currentMikro = listMikro.find(m => m.mingguKe === state.selectedProgramWeek) || listMikro[0];

    const myTes = state.tesFisik.filter(t => String(t.atletId) === String(atlet.id));
    
    const getSkor = (key) => {
        const item = myTes.find(t => t.keyTes === key);
        return item ? parseFloat(item.skor) : null;
    };

    const vo2max = getSkor('yoyo');
    const vsit = getSkor('vsit');
    const pushUp = getSkor('push_up');
    const ttest = getSkor('ttest');

        if (atlet.posisi === 'GK') {
            if (j.hari === 'Senin') {
                materiBaru = `Reaction & Lateral Shuffling Drill, Core Anti-Rotation, Throwing Accuracy 5m-15m`;

                const paceZone1 = vo2max ? `Pace ${(60 / (vo2max / 3.5 * 0.6)).toFixed(1)} Mnt/Km` : '60% MAS';
                materiBaru = `Light Recovery Run (${paceZone1}), Hip & Ankle Flexibility Work`;
            } else if (j.hari === 'Rabu') {
                materiBaru = `Knee Slides Mechanics, High-Ball Save Positioning, GK Specific Mobility`;
            } else if (j.hari === 'Jumat') {
                materiBaru = `Explosive Lower Body Power (Plyo Box, Kneeling Jump), Shoulder Stability`;
            } else if (j.hari === 'Sabtu') {
                materiBaru = `Game Simulation: Focus Reaction on Slot Area Shots & Quick Outlet Passes`;
            }
        } else {
            if (j.hari === 'Senin') {
                let fokusTeknik = pushUp && pushUp < 35 ? 'Upper Body Strength & Passing Power' : 'Core Stability & Drag Shot Mechanics';
                materiBaru = `${fokusTeknik}, Stationary Passing & Wall-Pass Precision`;
            } else if (j.hari === 'Selasa') {
                const paceZone = vo2max ? `Pace ${(60 / (vo2max / 3.5 * 0.75)).toFixed(1)} Mnt/Km` : 'Zone 2 MAS';
                materiBaru = `Continuous Aerobic Run (${paceZone}), ${vsit && vsit < 15 ? 'Hamstring Flexibility Focus' : 'General Mobility'}`;
            } else if (j.hari === 'Rabu') {
                let fokusAgility = ttest && ttest > 11.5 ? 'Change of Direction & Shuttle Drill' : 'High-Speed Stickhandling & Dribbling';
                materiBaru = `${fokusAgility}, Position Tactics (${atlet.posisi})`;
            } else if (j.hari === 'Jumat') {
                materiBaru = `Lower Split Strength (Squat & Deadlift), Upper Body Conditioning`;
            } else if (j.hari === 'Sabtu') {
                materiBaru = `Small Sided Games (3v3 / 4v4) - High Intensity Shift Rotation Focus`;
            }
        }

        return { ...j, materi: materiBaru };
    });

    const isCedera = atlet.cedera && atlet.cedera !== 'Tidak ada';
    const noteIndividual = isCedera 
        ? `<div class="p-4 mb-5 rounded-2xl bg-rose-50 border border-rose-200/90 text-rose-800 text-xs font-bold flex items-center gap-2.5 shadow-sm"><i class="fa-solid fa-triangle-exclamation text-rose-600 text-base"></i> Catatan Medis: ${escapeHTML(atlet.cedera)} - Rest/Jeda antar set ditambah & Volume latihan dikurangi 30%.</div>`
        : (atlet.posisi === 'GK' ? `<div class="p-4 mb-5 rounded-2xl bg-cyan-50 border border-cyan-200/90 text-cyan-950 text-xs font-bold flex items-center gap-2.5 shadow-sm"><i class="fa-solid fa-user-shield text-cyan-600 text-base"></i> Preskripsi Kiper (GK): Disesuaikan untuk reaksi eksplosif, kelincahan spesifik, dan lemparan presisi.</div>` : '');

    const summaryTesBadge = `
        <div class="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/80 mb-6 shadow-inner">
            <span class="block text-[10px] font-black uppercase text-slate-400 tracking-wider mb-2 flex items-center gap-1.5">

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs font-bold">
                <div class="bg-white p-2.5 rounded-xl border border-slate-200/90 shadow-sm flex items-center justify-between">
                    <span class="text-slate-400 font-extrabold text-[10px]">VO2Max</span>
                    <span class="font-mono font-black text-blue-900">${vo2max ? vo2max + ' ml/kg' : '-'}</span>
                </div>
                <div class="bg-white p-2.5 rounded-xl border border-slate-200/90 shadow-sm flex items-center justify-between">
                    <span class="text-slate-400 font-extrabold text-[10px]">Flexibility</span>
                    <span class="font-mono font-black text-emerald-700">${vsit ? vsit + ' cm' : '-'}</span>
                </div>

        function updateAtletJoggingCalculations() {
            const atlet = state.activeAtlet;
            if (!atlet) return;

            const historiList = state.joggingLogs || [];
            const matchLog = historiList.slice().reverse().find(item => 
                String(item.atletId) === String(atlet.id) || String(item.namaAtlet) === String(atlet.nama)
            );
            
            const waktuMnt = matchLog ? parseFloat(matchLog.waktu) : 30;
            const zonaFactor = matchLog ? matchLog.zona : "0.75";
            const jarakKm = matchLog ? parseFloat(matchLog.jarak) : 4.31;
            const paceFormatted = matchLog ? matchLog.pace : "5'48\"";
            
            const speedKmh = (waktuMnt > 0 && jarakKm > 0) 
                ? parseFloat((jarakKm / (waktuMnt / 60)).toFixed(1)) 
                : 8.6;
            const estKalori = Math.round(jarakKm * (atlet.bb || 65) * 0.75);

            const durasiInput = document.getElementById('run-durasi');
            const zonaInput = document.getElementById('run-zona');
            if (durasiInput) durasiInput.value = waktuMnt;
            if (zonaInput) {
                const z = String(zonaFactor);
                if (z.includes('0.6')) zonaInput.value = 'Zone 1 (60% MAS)';
                else if (z.includes('0.8')) zonaInput.value = 'Zone 3 (80% MAS)';
                else if (z.includes('0.9')) zonaInput.value = 'Zone 4 (90% MAS)';
                else if (z.includes('1')) zonaInput.value = 'Zone 5 (100% MAS)';
                else zonaInput.value = 'Zone 2: Aerobic Base (75% MAS)';
            }

            if (document.getElementById('run-pace-display')) document.getElementById('run-pace-display').innerText = paceFormatted;
            if (document.getElementById('run-jarak-display')) document.getElementById('run-jarak-display').innerText = `${jarakKm} km`;
            if (document.getElementById('run-speed-display')) document.getElementById('run-speed-display').innerText = `${speedKmh} km/h`;
            if (document.getElementById('run-kalori-display')) document.getElementById('run-kalori-display').innerText = `${estKalori} kcal`;
        }

        id: 'rpe_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        atletId: String(atlet.id),

        rpeVal: rpeVal,
        durasi: durasi,
        hrMax: hrMax,
        sRPE: sRPE,
        status: 'Disetujui' // Otomatis disetujui agar langsung terhitung di ACWR Menu 9
    };

    // 1. Simpan ke rpeLogs (State Utama)
    if (!state.rpeLogs) state.rpeLogs = [];
    state.rpeLogs.unshift(newRpe);
    saveStorage('rpeLogs', state.rpeLogs);

    // 2. Simpan juga ke allReports untuk fallback sinkronisasi
    let allReports = loadStorage('allReports') || [];
    allReports.unshift(newRpe);
    saveStorage('allReports', allReports);

    // 3. Kirim langsung ke Google Spreadsheet & Firebase
    if (typeof syncDataToSpreadsheet === 'function') {
        syncDataToSpreadsheet();
    }
    if (window.db && window.dbSet && window.dbRef) {
        window.dbSet(window.dbRef(window.db, 'rpeLogs/' + newRpe.id), newRpe);
    }

    renderSidebar(); 
    renderContent();
    showToast('Catatan RPE berhasil dikirim ke Pelatih!', 'success');
}

        function exportAcwrRpeCSV() {

            const rows = [];
            
            if (state.rpeLogs.length === 0) {
                state.atlet.forEach(at => {
                    const ac = calculateAtletACWR(at.id);
                    rows.push(['-', at.nama, at.posisi, '-', '-', '-', 0, ac.acuteLoad, ac.chronicLoad, ac.acwrRatio, ac.statusRisk]);
                });
            } else {
                state.rpeLogs.forEach(r => {
                    const at = state.atlet.find(a => String(a.id) === String(r.atletId)) || { nama: 'Unknown', posisi: '-' };
                    const ac = calculateAtletACWR(r.atletId);
                    rows.push([
                        r.tanggal || '-',
                        at.nama,
                        at.posisi,
                        r.rpeVal,
                        r.durasi,
                        r.hrMax || '-',
                        r.sRPE,
                        ac.acuteLoad,
                        ac.chronicLoad,
                        ac.acwrRatio,
                        ac.statusRisk
                    ]);
                });
            }

            exportToCSV('Rekap_ACWR_dan_RPE_Floorball.csv', headers, rows);
            showToast('File CSV ACWR & RPE berhasil diunduh!', 'success');
        }

        function exportPDFCustom(elementId, filenamePrefix) {
            const element = document.getElementById(elementId) || document.getElementById('main-container');
            if (!element) {
                showToast('Area dokumen tidak ditemukan!', 'error');
                return;
            }

            const toast = showToast('Membangun dokumen PDF resmi...', 'loading');

            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     `${filenamePrefix}_${new Date().toISOString().split('T')[0]}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                if (toast) toast.remove();
                showToast('Dokumen PDF Berhasil Diunduh!', 'success');
            }).catch(err => {
                if (toast) toast.remove();
                console.error("PDF Error:", err);
                showToast('Gagal memproses PDF. Mengalihkan ke Print bawaan...', 'error');
                window.print();
            });
        }

function generateJoggingSkuad(event) {
  if (event) event.preventDefault();

  if (!state.atlet || state.atlet.length === 0) {
    showToast("Data atlet belum dimuat!", "error");
    return;
  }

  const selectedId = document.getElementById('jogging-atlet-id')?.value;
  const zona = document.getElementById('jogging-zona')?.value || "0.75";
  const waktu = parseFloat(document.getElementById('jogging-waktu')?.value) || 25;
  const tanggal = document.getElementById('jogging-tanggal')?.value || new Date().toISOString().split('T')[0];

  let targetAthletes = [];
  if (selectedId === 'semua' || !selectedId) {
    targetAthletes = state.atlet;
  } else {
    const found = state.atlet.find(a => String(a.id) === String(selectedId));
    if (found) targetAthletes = [found];
  }

  if (targetAthletes.length === 0) {
    showToast("Atlet tidak ditemukan!", "error");
    return;
  }

  // Buat log untuk atlet yang dipilih
  const newLogs = targetAthletes.map(atlet => {
    const vo2 = getAtletVO2Max(atlet.id) || 45;
    const masKmh = vo2 / 3.5;
    const factor = parseFloat(zona) || 0.75;
    const speedKmh = masKmh * factor;
    const jarak = parseFloat(((speedKmh * waktu) / 60).toFixed(2));
    
    const paceMin = Math.floor(60 / speedKmh);
    const paceSec = Math.round(((60 / speedKmh) - paceMin) * 60);
    const paceStr = `${paceMin}'${paceSec < 10 ? '0' : ''}${paceSec}" /km`;

    return {
      id: 'j_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      atletId: String(atlet.id),
      namaAtlet: atlet.nama,
      tanggal: tanggal,
      vo2max: String(vo2),
      zona: zona,
      jarak: jarak,
      waktu: waktu,
      pace: paceStr
    };
  });

  // 1. Ambil tanggal yang sedang dipilih di form (misal: "2026-08-11")
  const selectedDate = tanggal;

  // 2. Buat Map baru KHUSUS untuk tanggal yang sedang dipilih
  const dailyLogMap = new Map();

  // 3. Masukkan 41 data baru untuk tanggal hari ini
  newLogs.forEach(item => {
    if (item && item.atletId) {
      // Kunci hanya berdasarkan atletId agar 1 atlet tepat memiliki 1 log di hari tersebut
      dailyLogMap.set(String(item.atletId), item);
    }
  });

  // 4. Set state HANYA berisi 41 log hari ini (riwayat hari lain tidak ditumpuk di tabel ini)
  state.joggingLogs = Array.from(dailyLogMap.values());
  
  // 5. Simpan ke LocalStorage
  saveStorage("joggingLogs", state.joggingLogs);

  // Sync ke Google Sheets jika fungsi tersedia
  if (typeof syncDataToSpreadsheet === 'function') {
    syncDataToSpreadsheet();
  }
  
  // Render ulang UI
  renderContent();
  showToast(`Berhasil menambahkan ${newLogs.length} log jogging!`, "success");
}

 function openAtletRadarModal(atletId) {
  const atlet = state.atlet.find(a => String(a.id) === String(atletId));
  if (!atlet) return;

  let modalEl = document.getElementById('atlet-radar-modal');
  if (!modalEl) {
    modalEl = document.createElement('div');
    modalEl.id = 'atlet-radar-modal';
    modalEl.className = 'fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4';
    document.body.appendChild(modalEl);
  }

  modalEl.innerHTML = `
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm text-white relative shadow-2xl">
      <button onclick="document.getElementById('atlet-radar-modal').remove()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-lg">&times;</button>
      <h3 class="text-lg font-black text-amber-400 text-center mb-1">${escapeHTML(atlet.nama)}</h3>
      <p class="text-xs text-slate-400 text-center mb-4">${escapeHTML(atlet.posisi || 'Pemain')} • ${escapeHTML(atlet.gender)}</p>
      
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <canvas id="atletRadarChart"></canvas>
      </div>
    </div>
  `;

  setTimeout(() => {
    renderAtletRadarChart(atlet);
  }, 50);
}
  let atletRadarChartInstance = null;
  function renderAtletRadarChart(atlet) {
    const ctx = document.getElementById('atletRadarChart');
    if (!ctx || typeof Chart === 'undefined') return;

    if (atletRadarChartInstance) {
      atletRadarChartInstance.destroy();
    }

    // Ambil nilai dari database tesFisik asli milik atlet
    const myTes = state.tesFisik.filter(t => String(t.atletId) === String(atlet.id));
    const getScore = (key, defaultVal) => {
      const item = myTes.find(t => t.keyTes === key);
      if (!item) return defaultVal;
      // Normalisasi skor sederhana ke skala 0-100 untuk radar
      const val = parseFloat(item.skor) || 0;
      return Math.min(100, Math.max(20, val * 1.5)); 
    };

    const dataRadar = [
      getScore('sprint20', 70), // Speed
      getScore('yoyo', 75),     // Endurance
      getScore('push_up', 65),  // Strength
      getScore('vsit', 80),     // Flexibility
      getScore('ttest', 70)     // Agility
    ];

    atletRadarChartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['Speed', 'Endurance', 'Strength', 'Flexibility', 'Agility'],
        datasets: [{
          label: 'Profil Kebugaran',
          data: dataRadar,
          backgroundColor: 'rgba(56, 189, 248, 0.25)',
          borderColor: '#38BDF8',
          pointBackgroundColor: '#38BDF8',
          pointBorderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        scales: {
          r: {
            angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
            grid: { color: 'rgba(255, 255, 255, 0.2)' },
            pointLabels: { color: '#cbd5e1', font: { size: 10, weight: 'bold' } },
            ticks: { display: false, beginAtZero: true, max: 100 }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  // 3. SHARE WHATSAPP PERTANDINGAN
  function shareMatchToWhatsApp() {
    const m = state.matchLive || {};
    const scoreTeam = m.scoreTeam || 0;
    const scoreOpponent = m.scoreOpponent || 0;
    const period = m.period || 'Match';

    let text = `🏑 *UPDATE SKOR MATCH LIVE FLOORBALL*\n`;
    text += `===============================\n`;
    text += `*TIM KITA* [ ${scoreTeam} ] vs [ ${scoreOpponent} ] *LAWAN*\n`;
    text += `Status: ${period}\n`;
    text += `Foul Tim: ${m.foulTeam || 0} | Foul Lawan: ${m.foulOpponent || 0}\n`;
    text += `===============================\n\n`;

    const events = m.spatialEvents || [];
    if (events.length > 0) {
      text += `📊 Total Aksi Lapangan Recorded: ${events.length} Event\n`;
    }

    text += `\n_Diproses otomatis via Coach Floorball System_ ⚡`;

    const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
    window.open(waUrl, '_blank');
  }

  // ... baris service worker sebelumnya ...
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      });
    }
    </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Masukkan kredensial Firebase asli Anda di sini
    const firebaseConfig = {
        apiKey: "API_KEY_ANDA",
        authDomain: "PROJECT_ID.firebaseapp.com",
        databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "PROJECT_ID",
        storageBucket: "PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    try {
        if (firebaseConfig.apiKey !== "API_KEY_ANDA") {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            window.db = db;
            window.dbRef = ref;
            window.dbSet = set;
            window.dbOnValue = onValue;

            onValue(ref(db, 'atletData'), (snapshot) => {
                const data = snapshot.val();
                if (data && Array.isArray(data) && window.state) {
                    window.state.atlet = data;
                    if (typeof saveStorage === 'function') saveStorage("atlet", data);
                    if (typeof renderSidebar === 'function') renderSidebar();
                    if (typeof renderContent === 'function') renderContent();
                }
            });
        }
    } catch (err) {
        console.warn("Firebase tidak diaktifkan:", err);
    }
</script>
