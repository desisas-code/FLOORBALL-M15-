    <script>
        // Hash SHA-256 resmi dari kata sandi "15midun07"
const COACH_PASSWORD_HASH = "2af4dd61d19195b72a787c2b107f2c0d294ea9d63a7adb827c09fe7a2ce9af3a";

// Fungsi pembantu hashing SHA-256 bawaan Web Crypto API
async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

    function getAtletGpsLocation() {

}

// =========================================================================
// INISIALISASI PETA LEAFLET
// =========================================================================
function initStravaMap(lat, lng) {
  const mapEl = document.getElementById('strava-map');
  if (!mapEl || typeof L === 'undefined') return;

  cleanupMaps();

  map = L.map('strava-map', {
    zoomControl: true,
    attributionControl: false
  }).setView([lat, lng], 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  runPathLine = L.polyline([], {
    color: '#FC4C02',
    weight: 5,
    opacity: 0.9,
    smoothFactor: 1
  }).addTo(map);

  setTimeout(() => {
    if (map) map.invalidateSize();
  }, 300);
}

let wakeLock = null;

// Fungsi menjaga layar HP tetap hidup saat lari
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        // Jika sistem operasi melepas paksa wake lock saat lari, minta kembali
        if (liveTrackingWatchId !== null) acquireWakeLock();
      });
    }
  } catch (err) {
    console.log("Wake Lock tidak diizinkan oleh sistem:", err);
  }
}

function releaseWakeLock() {
  if (wakeLock !== null) {
    try {
      wakeLock.release();
    } catch(e) {}
    wakeLock = null;
  }
}

// Handler mulai & stop tracking
function toggleLiveRunTracker() {
  const btn = document.getElementById('btn-toggle-run-tracker');
  const badge = document.getElementById('gps-status-badge');

  if (!navigator.geolocation) {
    showToast("HP tidak mendukung fitur Geolocation GPS!", "error");
    return;
  }

  // 1. JIKA SEDANG BERJALAN -> BERHENTIKAN TRACKING
  if (liveTrackingWatchId !== null) {
    stopLiveGpsInternal();

    if (btn) {
      btn.className = "w-full px-4 py-3.5 rounded-2xl bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-950 text-white font-black text-xs shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2";
      btn.innerHTML = `<i class="fa-solid fa-play text-cyan-400"></i> Mulai Tracking Sesi Lari`;
    }

    if (badge) {
      badge.className = "w-full mt-2.5 px-3.5 py-2.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-2xl text-xs font-bold text-center";
      badge.innerHTML = `<i class="fa-solid fa-flag-checkered mr-1.5"></i> Selesai • Total Jarak: ${liveRunMetrics.distanceKm.toFixed(2)} km`;
    }

    showToast(`Sesi lari selesai! Total: ${liveRunMetrics.distanceKm.toFixed(2)} km`, "success");
    return;
  }

  // 2. RESET METRIK AWAL
  liveRunMetrics.distanceKm = 0;
  liveRunMetrics.maxSpeedKmh = 0;
  liveRunMetrics.vehicleDetected = false;
  liveRunMetrics.startTime = Date.now();
  lastRecordedCoord = null;
  pathCoordinates = [];
  if (runPathLine) runPathLine.setLatLngs([]);

  acquireWakeLock(); // Aktifkan penahan layar agar tidak sleep

  if (btn) {
    btn.className = "w-full px-4 py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-black text-xs shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 animate-pulse";
    btn.innerHTML = `<i class="fa-solid fa-stop text-white"></i> Hentikan Sesi Lari (Selesai)`;
  }

  if (badge) {
    badge.className = "w-full mt-2.5 px-3.5 py-2.5 bg-blue-50 text-blue-900 border border-blue-200 rounded-2xl text-xs font-semibold text-center";
    badge.innerHTML = `<i class="fa-solid fa-satellite-dish fa-spin mr-1.5 text-blue-600"></i> Menghubungkan ke satelit GPS...`;
  }

  // Timer Menit
  if (liveRunMetrics.timerInterval) clearInterval(liveRunMetrics.timerInterval);
  liveRunMetrics.timerInterval = setInterval(() => {
    const elapsedMins = Math.floor((Date.now() - liveRunMetrics.startTime) / 60000);
    const durasiInput = document.getElementById('run-durasi');
    if (durasiInput) {
      durasiInput.value = elapsedMins > 0 ? elapsedMins : 1;
    }
  }, 1000);

  // Jalankan pelacak dengan sistem Auto-Reconnect
  startGpsWatchLoop();
}

function stopLiveGpsInternal() {
  if (liveTrackingWatchId !== null) {
    navigator.geolocation.clearWatch(liveTrackingWatchId);
    liveTrackingWatchId = null;
  }
  if (liveRunMetrics.timerInterval) {
    clearInterval(liveRunMetrics.timerInterval);
    liveRunMetrics.timerInterval = null;
  }
  releaseWakeLock();
}

// Loop Pelacak yang tahan banting (Auto-Reconnect bila timeout)
function startGpsWatchLoop() {
  if (liveTrackingWatchId !== null) {
    navigator.geolocation.clearWatch(liveTrackingWatchId);
  }

  const badge = document.getElementById('gps-status-badge');

  liveTrackingWatchId = navigator.geolocation.watchPosition(
    (position) => {
      const { latitude, longitude, accuracy, speed } = position.coords;
      const now = Date.now();

      // Toleransi akurasi hingga 100m saat awal lari
      if (accuracy > 100) {
        if (badge) {
          badge.innerHTML = `<i class="fa-solid fa-satellite fa-spin mr-1.5 text-amber-500"></i> Mengunci sinyal presisi (Akurasi: ±${Math.round(accuracy)}m)...`;
        }
        return;
      }

      if (!map) {
        initStravaMap(latitude, longitude);
      }

      const currentLatLng = [latitude, longitude];
      pathCoordinates.push(currentLatLng);
      if (runPathLine) runPathLine.setLatLngs(pathCoordinates);
      if (map) map.panTo(currentLatLng);

      let currentSpeedKmh = speed !== null && speed !== undefined ? (speed * 3.6) : 0;

      if (lastRecordedCoord) {
        const dist = calculateHaversineDistance(
          lastRecordedCoord.lat, lastRecordedCoord.lng,
          latitude, longitude
        );
        const timeDiffHours = (now - lastRecordedCoord.time) / (1000 * 3600);

        if ((!speed || speed === 0) && timeDiffHours > 0) {
          currentSpeedKmh = dist / timeDiffHours;
        }

        // Catat jarak jika berpindah lebih dari 2 meter
        if (dist > 0.002) {
          liveRunMetrics.distanceKm += dist;
          lastRecordedCoord = { lat: latitude, lng: longitude, time: now };
        }
      } else {
        lastRecordedCoord = { lat: latitude, lng: longitude, time: now };
      }

      if (currentSpeedKmh > liveRunMetrics.maxSpeedKmh) {
        liveRunMetrics.maxSpeedKmh = currentSpeedKmh;
      }

      let activity = "Jogging (Aerobic)";
      let badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-300";
      let iconAct = "fa-person-running text-emerald-600";

      if (currentSpeedKmh > 25) {
        activity = "TERDETEKSI KENDARAAN!";
        badgeStyle = "bg-rose-100 text-rose-800 border-rose-400 animate-bounce";
        iconAct = "fa-motorcycle text-rose-600";
        liveRunMetrics.vehicleDetected = true;
      } else if (currentSpeedKmh >= 11) {
        activity = "Sprint Cepat";
        badgeStyle = "bg-blue-100 text-blue-900 border-blue-300";
        iconAct = "fa-person-running text-blue-600";
      } else if (currentSpeedKmh < 1.0) {
        activity = "Diam / Siap";
        badgeStyle = "bg-slate-100 text-slate-700 border-slate-300";
        iconAct = "fa-person text-slate-500";
      }

      liveRunMetrics.currentActivity = activity;
      state.currentGpsLocation = `${latitude.toFixed(6)}, ${longitude.toFixed(6)} (${activity})`;

      if (badge) {
        badge.className = `w-full mt-2.5 px-3.5 py-2.5 rounded-2xl text-xs font-bold text-center border ${badgeStyle}`;
        badge.innerHTML = `<i class="fa-solid ${iconAct} mr-1.5"></i> ${activity} • ${liveRunMetrics.distanceKm.toFixed(2)} km (${currentSpeedKmh.toFixed(1)} km/h)`;
      }

      const distDisplay = document.getElementById('run-jarak-display');
      const speedDisplay = document.getElementById('run-speed-display');
      if (distDisplay) distDisplay.innerText = `${liveRunMetrics.distanceKm.toFixed(2)} km`;
      if (speedDisplay) speedDisplay.innerText = `${currentSpeedKmh.toFixed(1)} km/h`;
    },
    (error) => {
      console.warn("GPS Warning:", error.message);

      // KUNCI PERBAIKAN: Jika sinyal timeout/lemah, JANGAN STOP, tapi sambungkan ulang!
      if (error.code === 3 || error.code === 2) {
        if (badge) {
          badge.className = "w-full mt-2.5 px-3.5 py-2.5 bg-amber-50 text-amber-800 border border-amber-300 rounded-2xl text-xs font-semibold text-center";
          badge.innerHTML = `<i class="fa-solid fa-satellite-dish fa-spin mr-1.5"></i> Sinyal terhalang, menyambungkan ulang satelit...`;
        }
        // Restart loop setelah jeda 2 detik
        setTimeout(() => {
          if (liveTrackingWatchId !== null) startGpsWatchLoop();
        }, 2000);
      } else if (error.code === 1) {
        if (badge) {
          badge.className = "w-full mt-2.5 px-3.5 py-2.5 bg-rose-50 text-rose-700 border border-rose-200 rounded-2xl text-xs font-bold text-center";
          badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5 text-rose-500"></i> Izin lokasi ditolak di browser HP Anda!`;
        }
      }
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 2000
    }
  );
}

        function handleLogin(e) {
    e.preventDefault();
    const toast = showToast('Memverifikasi akses...', 'loading');

    setTimeout(async () => {
        if (toast) toast.remove();
        if (state.loginRole === 'pelatih') {
            const passInputElem = document.getElementById('auth-input-password');
            const passInput = passInputElem ? passInputElem.value : '';
            
            // Cek kecocokan hash sandi pelatih
            const hashedInput = await sha256(passInput);
            if (hashedInput !== COACH_PASSWORD_HASH) {
                showToast('Kata sandi Pelatih salah!', 'error');
                return;
            }
            
            state.currentRole = 'Pelatih';
            state.currentMenu = 'menu-1';
            state.activeAtlet = null;

            saveStorage('authSession', { role: 'Pelatih', activeAtlet: null });
            
            if (document.getElementById('user-avatar')) document.getElementById('user-avatar').innerText = 'PK';
            if (document.getElementById('user-name')) document.getElementById('user-name').innerText = 'Pelatih Kepala';
            if (document.getElementById('user-status')) document.getElementById('user-status').innerText = 'Head Coach';
            if (document.getElementById('current-role-badge')) document.getElementById('current-role-badge').innerText = 'Pelatih Kepala';

            if (document.getElementById('login-screen')) document.getElementById('login-screen').classList.add('hidden');
            if (document.getElementById('app-screen')) document.getElementById('app-screen').classList.remove('hidden');
            
            renderSidebar();
            renderContent();
            showToast('Berhasil masuk Mode Pelatih!', 'success');
        } else {
            // Mode login Atlet
            const selectAtletElem = document.getElementById('auth-select-atlet');
            const inputPinElem = document.getElementById('auth-input-pin');
            const selectedId = selectAtletElem ? selectAtletElem.value : '';
            const inputPin = inputPinElem ? inputPinElem.value.trim() : '';

            const targetAtlet = state.atlet.find(a => String(a.id).trim().toLowerCase() === String(selectedId).trim().toLowerCase());

            if (!targetAtlet || targetAtlet.pin !== inputPin) {
                showToast('PIN yang Anda masukkan salah untuk atlet ini!', 'error');
                return;
            }

            state.activeAtlet = targetAtlet;
            state.currentRole = 'Atlet';
            state.currentMenu = 'menu-atlet-1';

            saveStorage('authSession', { role: 'Atlet', activeAtlet: targetAtlet });

            const initials = targetAtlet.nama.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            if (document.getElementById('user-avatar')) document.getElementById('user-avatar').innerText = initials;
            if (document.getElementById('user-name')) document.getElementById('user-name').innerText = escapeHTML(targetAtlet.nama);
            if (document.getElementById('user-status')) document.getElementById('user-status').innerText = `Atlet - ${escapeHTML(targetAtlet.posisi)}`;
            if (document.getElementById('current-role-badge')) document.getElementById('current-role-badge').innerText = 'Atlet Skuad';

        function logout() {
  			cleanupThreeJS();
			cleanupMaps();

  // Hentikan timer pertandingan jika sedang berjalan
  if (state.matchLive.dribbleTimer && state.matchLive.dribbleTimer.intervalId) {
    clearInterval(state.matchLive.dribbleTimer.intervalId);
    state.matchLive.dribbleTimer.isRunning = false;
  }
  if (state.matchLive.matchTimer && state.matchLive.matchTimer.intervalId) {
    clearInterval(state.matchLive.matchTimer.intervalId);
    state.matchLive.matchTimer.isRunning = false;
  }

  // Hapus sesi login dari memori browser
  localStorage.removeItem('cf_authSession');
  state.activeAtlet = null;
  state.currentRole = 'Pelatih';

  // Alihkan tampilan kembali ke layar login
  const appScreen = document.getElementById('app-screen');
  const loginScreen = document.getElementById('login-screen');
  if (appScreen) appScreen.classList.add('hidden');
  if (loginScreen) loginScreen.classList.remove('hidden');

  selectLoginRole('pelatih');
  showToast('Anda telah keluar dari aplikasi.', 'success');
}

        function showToast(message, type = 'loading') {
            const container = document.getElementById('toast-container');
            if(!container) return null;
            const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = type === 'success' ? 'fa-circle-check text-emerald-500' : (type === 'error' ? 'fa-circle-xmark text-rose-500' : 'fa-spinner fa-spin text-blue-800');
    toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
    container.appendChild(toast);

    if (type !== 'loading') {
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'all 0.35s ease';
            setTimeout(() => toast.remove(), 350);
        }, 3000);
    }
    return toast;
}

                customClass: { popup: 'rounded-3xl', confirmButton: 'rounded-2xl font-bold', cancelButton: 'rounded-2xl font-bold' }
            });
            return result.isConfirmed;

  let pollInterval = null;

  function setupAdaptivePolling() {
    const runPoll = () => {
      if (!document.hidden && navigator.onLine) {
        autoFetchFromSpreadsheet();
      }
    };

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInterval(pollInterval);
      } else {
        runPoll();
        pollInterval = setInterval(runPoll, 30000);
      }
    });

    pollInterval = setInterval(runPoll, 30000);
  }

  let atletRadarChartInstance = null;
  function renderAtletRadarChart(atlet) {
    const ctx = document.getElementById('atletRadarChart');
    if (!ctx || typeof Chart === 'undefined') return;

    if (atletRadarChartInstance) {
      atletRadarChartInstance.destroy();
    }

    // Ambil nilai dari database tesFisik asli milik atlet
    const myTes = state.tesFisik.filter(t => String(t.atletId) === String(atlet.id));
    const getScore = (key, defaultVal) => {
      const item = myTes.find(t => t.keyTes === key);
      if (!item) return defaultVal;
      // Normalisasi skor sederhana ke skala 0-100 untuk radar
      const val = parseFloat(item.skor) || 0;
      return Math.min(100, Math.max(20, val * 1.5)); 
    };

    const dataRadar = [
      getScore('sprint20', 70), // Speed
      getScore('yoyo', 75),     // Endurance
      getScore('push_up', 65),  // Strength
      getScore('vsit', 80),     // Flexibility
      getScore('ttest', 70)     // Agility
    ];

                } else {
                    const payload = {

                        updatedAt: new Date().toISOString()
                    };

                console.warn("Gagal update ke Firebase:", e);
