    <script>
        const COACH_PASSWORD_DEFAULT = "midun15";
        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8yriN-6Hd8qHuHOHGwbSUExTZZsH_D1tgiTCBlwJSQ2r5_T3i7A2XGk5Dnb3vREKU/exec"; 

        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        const chartInstances = {};

        function renderChartsForMenu(menuId) {
            Object.keys(chartInstances).forEach(key => {
                if (chartInstances[key]) {
                    chartInstances[key].destroy();
                    delete chartInstances[key];
                }
            });

            // 1. MENU ATLET & PIN
            if (menuId === 'menu-1') {
                const ctxPos = document.getElementById('chart-posisi-atlet')?.getContext('2d');
                if (ctxPos) {
                    const counts = { DL: 0, DR: 0, FL: 0, FR: 0, C: 0, GK: 0 };
                    state.atlet.forEach(a => { if (counts[a.posisi] !== undefined) counts[a.posisi]++; });

                    chartInstances['posisi'] = new Chart(ctxPos, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(counts),
                            datasets: [{
                                data: Object.values(counts),
                                backgroundColor: ['#38BDF8', '#0284C7', '#3B82F6', '#1D4ED8', '#6366F1', '#F59E0B'],
                                borderWidth: 3,
                                borderColor: '#ffffff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'right',
                                    labels: {
                                        boxWidth: 12,
                                        font: { size: 11, weight: 'bold' }
                                    }
                                }
                            }
                        }
                    });
                }
            }

            // 2. ABSENSI
            if (menuId === 'menu-2') {
                const ctx = document.getElementById('chart-absensi-overview')?.getContext('2d');
                if (ctx) {
                    const summary = getAtletAbsensiSummary();

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'loading') {
            const container = document.getElementById('toast-container');
            if(!container) return null;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = type === 'success' ? 'fa-circle-check text-emerald-500' : (type === 'error' ? 'fa-circle-xmark text-rose-500' : 'fa-spinner fa-spin text-blue-800');
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
            container.appendChild(toast);

            if (type !== 'loading') {
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'all 0.35s ease';
                    setTimeout(() => toast.remove(), 350);
                }, 3000);
            }
            return toast;
        }

            });
            return result.isConfirmed;
        }

                                <input type="password" id="auth-input-pin" required maxlength="6" placeholder="Masukkan PIN rahasia Anda" class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 text-sm font-mono font-bold focus:outline-none focus:border-blue-700">
                            </div>
                        </div>
                    `;
                }
                if(button) button.innerHTML = 'Masuk Mode Atlet <i class="fa-solid fa-arrow-right text-xs"></i>';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const toast = showToast('Memverifikasi akses...', 'loading');

            setTimeout(() => {
                if(toast) toast.remove();
                if (state.loginRole === 'pelatih') {
                    const passInputElem = document.getElementById('auth-input-password');
                    const passInput = passInputElem ? passInputElem.value : '';
                    if (passInput !== COACH_PASSWORD_DEFAULT) {
                        showToast('Kata sandi Pelatih salah!', 'error');
                        return;
                    }
                    state.currentRole = 'Pelatih';
                    state.currentMenu = 'menu-1';
                    state.activeAtlet = null;
                    saveStorage('activeAtlet', null);
                    
                    if(document.getElementById('user-avatar')) document.getElementById('user-avatar').innerText = 'PK';
                    if(document.getElementById('user-name')) document.getElementById('user-name').innerText = 'Pelatih Kepala';
                    if(document.getElementById('user-status')) document.getElementById('user-status').innerText = 'Head Coach';
                    if(document.getElementById('current-role-badge')) document.getElementById('current-role-badge').innerText = 'Pelatih Kepala';

                    document.getElementById('login-screen')?.classList.add('hidden');
                    document.getElementById('app-screen')?.classList.remove('hidden');
                    
                    renderSidebar();
                    renderContent();
                    showToast('Berhasil masuk Mode Pelatih!', 'success');
                } else {
                    const selectAtletElem = document.getElementById('auth-select-atlet');
                    const inputPinElem = document.getElementById('auth-input-pin');
                    const selectedId = selectAtletElem ? selectAtletElem.value : '';
                    const inputPin = inputPinElem ? inputPinElem.value.trim() : '';

                    const targetAtlet = state.atlet.find(a => String(a.id) === String(selectedId));

                    if (!targetAtlet || targetAtlet.pin !== inputPin) {
                        showToast('PIN yang Anda masukkan salah untuk atlet ini!', 'error');
                        return;
                    }

                    state.activeAtlet = targetAtlet;
                    saveStorage('activeAtlet', targetAtlet);
                    state.currentRole = 'Atlet';
                    state.currentMenu = 'menu-atlet-1';

                    const initials = targetAtlet.nama.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    if(document.getElementById('user-avatar')) document.getElementById('user-avatar').innerText = initials;
                    if(document.getElementById('user-name')) document.getElementById('user-name').innerText = escapeHTML(targetAtlet.nama);
                    if(document.getElementById('user-status')) document.getElementById('user-status').innerText = `Atlet - ${escapeHTML(targetAtlet.posisi)}`;
                    if(document.getElementById('current-role-badge')) document.getElementById('current-role-badge').innerText = 'Atlet Skuad';

                    document.getElementById('login-screen')?.classList.add('hidden');
                    document.getElementById('app-screen')?.classList.remove('hidden');
                    
                    renderSidebar();
                    renderContent();
                    showToast(`Selamat datang, ${escapeHTML(targetAtlet.nama)}!`, 'success');
                }
            }, 400);
        }

        function logout() {
            document.getElementById('app-screen')?.classList.add('hidden');
            document.getElementById('login-screen')?.classList.remove('hidden');
            state.activeAtlet = null;
            saveStorage('activeAtlet', null);
            selectLoginRole('pelatih');
            showToast('Anda telah keluar dari aplikasi.', 'success');
        }

        function renderSidebar() {
            const menuContainer = document.getElementById('sidebar-menu');
            if(!menuContainer) return;
            const currentRoleMenus = menus[state.currentRole];
            
            const pendingValidasiCount = (state.laporanValidasi || []).filter(l => l && l.status === 'Menunggu').length;
            const rpeCount = (state.rpeLogs || []).length;

            menuContainer.innerHTML = currentRoleMenus.map(menu => {
                const isActive = menu.id === state.currentMenu;
                const activeClass = isActive 
                    ? 'bg-gradient-to-r from-sky-400 via-blue-400 to-sky-500 text-white font-black shadow-lg shadow-sky-400/40 border-l-4 border-blue-200' 
                    : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 font-extrabold hover:translate-x-1';
                
                const textHideClass = state.sidebarCollapsed ? 'hidden' : '';

                let badgeHtml = '';
                if (!state.sidebarCollapsed) {
                    if (menu.badgeKey === 'validasi' && pendingValidasiCount > 0) {
                        badgeHtml = `<span class="bg-amber-400 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full shadow-sm">${pendingValidasiCount}</span>`;
                    } else if (menu.badgeKey === 'acwr' && rpeCount > 0) {
                        badgeHtml = `<span class="bg-cyan-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full shadow-sm">${rpeCount}</span>`;
                    }
                }

                return `
                    <button onclick="navigate('${menu.id}')" class="w-full flex items-center justify-between px-3.5 py-3.5 rounded-2xl transition-all duration-200 text-xs ${activeClass} overflow-hidden whitespace-nowrap group" title="${menu.name}">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${menu.icon} text-base w-5 text-center shrink-0 transition-transform group-hover:scale-110"></i>
                            <span class="sidebar-text truncate ${textHideClass}">${menu.name}</span>
                        </div>
                        ${badgeHtml}
                    </button>
                `;
            }).join('');
        }

        function navigate(menuId) {
            state.currentMenu = menuId;
            const menu = document.getElementById('sidebar-menu');
            if (menu && window.innerWidth < 768) {
                menu.classList.add('hidden');
            }
            renderSidebar();
            renderContent();
        }

        function toggleSidebarDesktop() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            const sidebar = document.getElementById('main-sidebar');
            const icon = document.getElementById('toggle-sidebar-icon');
            const texts = document.querySelectorAll('.sidebar-text');

            if (state.sidebarCollapsed) {
                sidebar.classList.remove('md:w-72');
                sidebar.classList.add('md:w-20');
                if(icon) icon.className = 'fa-solid fa-chevron-right text-xs';
                texts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.remove('md:w-20');
                sidebar.classList.add('md:w-72');
                if(icon) icon.className = 'fa-solid fa-chevron-left text-xs';
                texts.forEach(el => el.classList.remove('hidden'));
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('sidebar-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        function openModalAtlet(id = null) {
            const modal = document.getElementById('modal-atlet');
            const title = document.getElementById('modal-title');
            const btnSubmit = document.getElementById('btn-submit-modal');
            const inputId = document.getElementById('input-id');

            if (id) {
                const target = state.atlet.find(a => String(a.id) === String(id));
                if (!target) return;

                if (title) title.innerHTML = `<i class="fa-solid fa-user-pen text-blue-800"></i> Edit Data Atlet`;
                if (btnSubmit) btnSubmit.innerText = 'Update Data Atlet';
                if (inputId) inputId.value = target.id;

                if (document.getElementById('input-nama')) document.getElementById('input-nama').value = target.nama || '';
                if (document.getElementById('input-posisi')) document.getElementById('input-posisi').value = target.posisi || '';
                if (document.getElementById('input-gender')) document.getElementById('input-gender').value = target.gender || '';
                if (document.getElementById('input-usia')) document.getElementById('input-usia').value = target.usia || '';
                if (document.getElementById('input-pin')) document.getElementById('input-pin').value = target.pin || '';
                if (document.getElementById('input-tb')) document.getElementById('input-tb').value = target.tb || '';
                if (document.getElementById('input-bb')) document.getElementById('input-bb').value = target.bb || '';
                if (document.getElementById('input-cedera')) document.getElementById('input-cedera').value = (target.cedera === 'Tidak ada' ? '' : target.cedera) || '';
            } else {
                if (title) title.innerHTML = `<i class="fa-solid fa-user-plus text-blue-800"></i> Input Data Atlet Baru`;
                if (btnSubmit) btnSubmit.innerText = 'Simpan Data Atlet';
                if (inputId) inputId.value = '';
                document.getElementById('form-atlet')?.reset();
            }
            modal?.classList.remove('hidden');
        }

        function closeModalAtlet() {
            document.getElementById('modal-atlet')?.classList.add('hidden');
            document.getElementById('form-atlet')?.reset();
            const inputId = document.getElementById('input-id');
            if(inputId) inputId.value = '';
        }

        function submitFormAtletOptimistic(e) {
            e.preventDefault();
            const id = document.getElementById('input-id')?.value;
            const nama = document.getElementById('input-nama')?.value;
            const posisi = document.getElementById('input-posisi')?.value;
            const gender = document.getElementById('input-gender')?.value;
            const usia = document.getElementById('input-usia')?.value;
            const pin = document.getElementById('input-pin')?.value;
            const tb = document.getElementById('input-tb')?.value;
            const bb = document.getElementById('input-bb')?.value;
            const cederaInput = document.getElementById('input-cedera')?.value.trim();
            const cedera = cederaInput && cederaInput.length > 0 ? cederaInput : 'Tidak ada';

            if (id) {
                const idx = state.atlet.findIndex(a => String(a.id) === String(id));
                if (idx !== -1) {
                    state.atlet[idx] = { 
                        id: state.atlet[idx].id, nama, posisi, gender, 
                        usia: parseInt(usia), tb: parseInt(tb), bb: parseInt(bb), pin, cedera 
                    };
                }
            } else {
                state.atlet.unshift({ 
                    id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4), 
                    nama, posisi, gender, usia: parseInt(usia), tb: parseInt(tb), bb: parseInt(bb), pin, cedera 
                });
            }

            saveStorage('atlet', state.atlet);
            closeModalAtlet();
            renderContent();
            showToast('Data atlet berhasil diperbarui!', 'success');
        }

        async function deleteAtletOptimistic(id) {
            const isConfirmed = await confirmAction('Hapus Atlet', 'Apakah Anda yakin ingin menghapus atlet ini?');
            if (!isConfirmed) return;

            state.atlet = state.atlet.filter(a => String(a.id) !== String(id));
            saveStorage('atlet', state.atlet);
            renderContent();
            showToast('Atlet berhasil dihapus!', 'success');
        }

        function getAtletAbsensiSummary(atletId = null) {
            let targetAtlet = atletId ? state.atlet.filter(a => String(a.id) === String(atletId)) : state.atlet;
            return targetAtlet.map(a => {
                const records = state.absensi.filter(ab => String(ab.atletId) === String(a.id));
                const total = records.length;
                let hadir = 0, telat = 0, sakit = 0, izin = 0, alpa = 0;
                records.forEach(r => {
                    if (r.status === 'Hadir') hadir++;
                    else if (r.status === 'Telat') telat++;
                    else if (r.status === 'Sakit') sakit++;
                    else if (r.status === 'Izin') izin++;
                    else if (r.status === 'Alpa') alpa++;
                });
                const persentase = total > 0 ? Math.round(((hadir + telat) / total) * 100) : 0;
                return { ...a, total, hadir, telat, sakit, izin, alpa, persentase };
            });
        }

        function getAtletVO2Max(atletId) {
            const records = state.tesFisik.filter(t => String(t.atletId) === String(atletId) && t.keyTes === 'yoyo');
            return records.length > 0 ? parseFloat(records[0].skor) : null; 
        }

        function calculateAtletACWR(atletId) {
            const logs = state.rpeLogs.filter(r => String(r.atletId) === String(atletId));
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let acuteLoad = 0;   
            let chronicSum = 0;  

            logs.forEach(log => {
                if (!log.tanggal) return;
                const logDate = new Date(log.tanggal);
                logDate.setHours(0, 0, 0, 0);
                const diffDays = Math.floor((today - logDate) / (1000 * 60 * 60 * 24));

                if (diffDays >= 0 && diffDays < 7) {
                    acuteLoad += (log.sRPE || 0);
                }
                if (diffDays >= 0 && diffDays < 28) {
                    chronicSum += (log.sRPE || 0);
                }
            });

            const chronicLoad = Math.round(chronicSum / 4);
            let acwrRatio = chronicLoad > 0 ? parseFloat((acuteLoad / chronicLoad).toFixed(2)) : 0;

            let statusRisk = "Underloading";
            if (acwrRatio >= 0.8 && acwrRatio <= 1.3) {
                statusRisk = "Sweet Spot (Aman)";
            } else if (acwrRatio > 1.3 && acwrRatio <= 1.5) {
                statusRisk = "High Risk (Waspada)";
            } else if (acwrRatio > 1.5) {
                statusRisk = "Danger Zone (Sangat Rawan)";
            }

            return { acuteLoad, chronicLoad, acwrRatio, statusRisk, totalLogs: logs.length };
        }

        function getACWRStatus(atlet) {
            const ac = calculateAtletACWR(atlet.id);
            if (ac.totalLogs === 0) return { ratio: '0.00', label: 'No Data', color: 'bg-slate-100 text-slate-600 border-slate-300' };
            if (ac.acwrRatio < 0.8) return { ratio: ac.acwrRatio, label: 'Under', color: 'bg-blue-50 text-blue-700 border-blue-200' };
            if (ac.acwrRatio <= 1.3) return { ratio: ac.acwrRatio, label: 'Optimal', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
            if (ac.acwrRatio <= 1.5) return { ratio: ac.acwrRatio, label: 'Caution', color: 'bg-amber-50 text-amber-700 border-amber-200' };
            return { ratio: ac.acwrRatio, label: 'High Risk', color: 'bg-rose-50 text-rose-700 border-rose-200' };
        }

        function generateDynamicPeriodisasi(startDateStr, totalWeeks) {
            const list = [];
            if (!startDateStr || !totalWeeks) return list;

            let start = new Date(startDateStr);
            for (let i = 1; i <= totalWeeks; i++) {
                let end = new Date(start);
                end.setDate(end.getDate() + 6);

                const dateRangeStr = `${start.getDate()} ${start.toLocaleString('id-ID', { month: 'short' })} - ${end.getDate()} ${end.toLocaleString('id-ID', { month: 'short' })} ${end.getFullYear()}`;
                let progress = i / totalWeeks;
                let fase = "Persiapan Umum (TPU)", faseCode = "AA", badgeBg = "bg-blue-100 text-blue-900 border-blue-200";
                let volPct = 80, intPct = 60, volLbl = "Tinggi", intLbl = "Sedang", hrTarget = "130-150 BPM";

                if (progress <= 0.30) {
                    fase = "Persiapan Umum (TPU)"; faseCode = "AA"; badgeBg = "bg-blue-100 text-blue-900 border-blue-200";
                    volPct = Math.min(95, 75 + (i * 4)); intPct = 60; volLbl = "Sangat Tinggi"; intLbl = "Sedang"; hrTarget = "130-150 BPM";
                } else if (progress <= 0.65) {
                    fase = "Persiapan Khusus (TPK)"; faseCode = "Strength"; badgeBg = "bg-emerald-100 text-emerald-900 border-emerald-200";
                    volPct = 80; intPct = Math.min(90, 65 + (i * 3)); volLbl = "Tinggi"; intLbl = "Tinggi"; hrTarget = "150-175 BPM";
                } else if (progress <= 0.85) {
                    fase = "Pra-Kompetisi (K1)"; faseCode = "Speed & Agility"; badgeBg = "bg-amber-100 text-amber-900 border-amber-200";
                    volPct = 60; intPct = 95; volLbl = "Sedang"; intLbl = "Sangat Tinggi"; hrTarget = "170-190 BPM";
                } else if (progress <= 0.95) {
                    fase = "Kompetisi Utama (K2)"; faseCode = "Tapering"; badgeBg = "bg-rose-100 text-rose-900 border-rose-200";
                    volPct = 35; intPct = 100; volLbl = "Sangat Rendah"; intLbl = "Maksimal (Tajam)"; hrTarget = "180-195 BPM";
                } else {
                    fase = "Transisi / Recovery"; faseCode = "AA"; badgeBg = "bg-slate-100 text-slate-700 border-slate-200";
                    volPct = 30; intPct = 40; volLbl = "Sangat Rendah"; intLbl = "Rendah"; hrTarget = "110-130 BPM";
                }

                list.push({
                    mingguKe: i, rentangTanggal: dateRangeStr, fase, faseCode, badgeBg,
                    volumePct: volPct, volumeLabel: volLbl, intensitasPct: intPct, intensitasLabel: intLbl, hrTarget
                });
                start.setDate(start.getDate() + 7);
            }
            return list;
        }

        function hitungKategoriNorma(keyTes, valStr, gender, posisi) {
            const val = parseFloat(valStr);
            if (isNaN(val) || val <= 0) return '-';
            const isPutra = (gender === 'Putra');

            if (keyTes === 'yoyo') {
                if (isPutra) {
                    if (val >= 54) return 'SB'; if (val >= 49) return 'B'; if (val >= 44) return 'S'; if (val >= 39) return 'K'; return 'SK';
                } else {
                    if (val >= 56) return 'SB'; if (val >= 46) return 'B'; if (val >= 41) return 'S'; if (val >= 37) return 'K'; return 'SK';
                }
            }
            if (keyTes === 'plank') {
                if (isPutra) {
                    if (val >= 240) return 'SB'; if (val >= 180) return 'B'; if (val >= 120) return 'S'; if (val >= 60) return 'K'; return 'SK';
                } else {
                    if (val >= 210) return 'SB'; if (val >= 150) return 'B'; if (val >= 80) return 'S'; if (val >= 45) return 'K'; return 'SK';
                }
            }
            if (keyTes === 'push_up') {
                if (isPutra) {
                    if (val >= 55) return 'SB'; if (val >= 45) return 'B'; if (val >= 35) return 'S'; if (val >= 24) return 'K'; return 'SK';
                } else {
                    if (val >= 54) return 'SB'; if (val >= 44) return 'B'; if (val >= 34) return 'S'; if (val >= 19) return 'K'; return 'SK';
                }
            }
            return 'S';
        }

        async function syncDataToSpreadsheet() {
            const toast = showToast("Menyinkronkan data ke Google Spreadsheet...", "loading");
            const payload = {
                atlet: state.atlet || [],
                absensi: state.absensi || [],
                tesFisik: state.tesFisik || [],
                tesTeknik: state.tesTeknik || [],
                periodisasiConfig: state.periodisasiConfig || null,
                joggingLogs: state.joggingLogs || [],
                masLogs: state.masLogs || [],
                laporanValidasi: state.laporanValidasi || [],
                rpeLogs: state.rpeLogs || [],
                lastSynced: new Date().toISOString()
            };

            try {
                await fetch(GOOGLE_SHEET_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                if (toast) toast.remove();
                showToast("Data berhasil dibackup ke Spreadsheet!", "success");
            } catch (err) {
                if (toast) toast.remove();
                showToast("Sinkronisasi gagal, data disimpan di lokal.", "error");
            }
        }

        async function autoFetchFromSpreadsheet() {
            try {
                const res = await fetch(`${GOOGLE_SHEET_WEB_APP_URL}?_t=${new Date().getTime()}`);
                const data = await res.json();
                if (data && data.status === "success") {
                    if (data.atlet && Array.isArray(data.atlet) && data.atlet.length > 0) {
                        state.atlet = data.atlet;
                        saveStorage("atlet", data.atlet);
                    }
                    if (typeof renderContent === 'function') renderContent();
                }
            } catch (e) {
                console.log("Background sync idle...");
            }
        }

        function exportPDFCustom(elementId, filenamePrefix) {
            const element = document.getElementById(elementId) || document.getElementById('main-container');
            if (!element) return;
            const toast = showToast('Membangun dokumen PDF...', 'loading');
            const opt = {
                margin: [10, 10, 10, 10],
                filename: `${filenamePrefix}_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                if (toast) toast.remove();
                showToast('Dokumen PDF berhasil diunduh!', 'success');
            }).catch(err => {
                if (toast) toast.remove();
                window.print();
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            selectLoginRole('pelatih');
            renderContent();
            autoFetchFromSpreadsheet();
        });
    </script>
